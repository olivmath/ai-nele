<title>Hack Posts Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0a;
    --surface: #111113;
    --lime: #ccff00;
    --red: #ef4444;
    --text: #e0e0e0;
    --muted: rgba(255,255,255,0.35);
    --border: rgba(255,255,255,0.08);
  }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Space Grotesk', system-ui, sans-serif;
    max-width: 820px;
    margin: 0 auto;
    padding: 48px 24px 80px;
  }
  .mono { font-family: 'JetBrains Mono', monospace; }

  header { margin-bottom: 48px; }
  header h1 {
    font-size: 1.75rem;
    font-weight: 700;
    letter-spacing: -0.03em;
    margin-bottom: 6px;
  }
  header h1 span { color: var(--lime); }
  header p { color: var(--muted); font-size: 0.85rem; }

  .progress-wrap {
    margin-bottom: 40px;
    display: flex;
    align-items: center;
    gap: 16px;
  }
  .progress-bar {
    flex: 1;
    height: 6px;
    background: var(--surface);
    border-radius: 3px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    background: var(--lime);
    border-radius: 3px;
    width: 0%;
    transition: width 0.6s ease;
  }
  .progress-label {
    font-size: 0.75rem;
    color: var(--muted);
    white-space: nowrap;
  }
  .progress-label b { color: var(--lime); font-weight: 700; }

  .case-list { display: flex; flex-direction: column; gap: 8px; }

  .case-card {
    display: grid;
    grid-template-columns: 36px 1fr auto;
    align-items: center;
    gap: 16px;
    padding: 16px 20px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    transition: border-color 0.2s;
  }
  .case-card:hover { border-color: rgba(204,255,0,0.2); }
  .case-card.done { border-left: 3px solid var(--lime); }

  .case-num {
    font-size: 0.7rem;
    font-weight: 700;
    color: var(--muted);
    letter-spacing: 0.15em;
    text-align: center;
  }

  .case-info h3 {
    font-size: 0.95rem;
    font-weight: 600;
    margin-bottom: 4px;
    letter-spacing: -0.01em;
  }
  .case-meta {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    align-items: center;
  }
  .case-value {
    font-size: 0.75rem;
    font-weight: 700;
    color: var(--red);
  }
  .case-vuln {
    font-size: 0.65rem;
    color: var(--muted);
    letter-spacing: 0.1em;
    text-transform: uppercase;
  }

  .status-chips {
    display: flex;
    gap: 6px;
    flex-shrink: 0;
  }
  .chip {
    font-size: 0.6rem;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    padding: 4px 10px;
    border-radius: 6px;
    white-space: nowrap;
  }
  .chip.pending {
    background: rgba(255,255,255,0.05);
    color: var(--muted);
  }
  .chip.working {
    background: rgba(204,255,0,0.1);
    color: var(--lime);
    animation: pulse 2s ease-in-out infinite;
  }
  .chip.ready {
    background: rgba(204,255,0,0.15);
    color: var(--lime);
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.5; }
  }

  .legend {
    margin-top: 32px;
    display: flex;
    gap: 20px;
    justify-content: center;
  }
  .legend-item {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 0.65rem;
    color: var(--muted);
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }
  .legend-dot {
    width: 8px;
    height: 8px;
    border-radius: 4px;
  }
  .legend-dot.l-pending { background: rgba(255,255,255,0.15); }
  .legend-dot.l-working { background: var(--lime); animation: pulse 2s ease-in-out infinite; }
  .legend-dot.l-ready { background: var(--lime); }

  @media (max-width: 600px) {
    .case-card { grid-template-columns: 28px 1fr; gap: 10px; }
    .status-chips { grid-column: 1 / -1; justify-self: start; }
  }
</style>

<header>
  <h1>Solbook <span>Hack Posts</span></h1>
  <p class="mono">11 carrosseis LinkedIn · produção em andamento</p>
</header>

<div class="progress-wrap">
  <div class="progress-bar"><div class="progress-fill" id="pbar"></div></div>
  <div class="progress-label mono"><b id="pcount">0</b>/22 entregas</div>
</div>

<div class="case-list" id="cases"></div>

<div class="legend">
  <div class="legend-item"><div class="legend-dot l-pending"></div> Pendente</div>
  <div class="legend-item"><div class="legend-dot l-working"></div> Em progresso</div>
  <div class="legend-item"><div class="legend-dot l-ready"></div> Pronto</div>
</div>

<script>
const cases = [
  { id: '01', name: 'The DAO', value: 'US$60M', vuln: 'Reentrancy', date: '2016', textFile: '2026-08-27-the-dao-hack.md', carouselFile: 'carousel-hack-01-the-dao.html' },
  { id: '02', name: 'Parity Wallet', value: 'US$280M', vuln: 'Selfdestruct', date: '2017', textFile: '2026-08-27-parity-wallet-hack.md', carouselFile: 'carousel-hack-02-parity-wallet.html' },
  { id: '03', name: 'BeautyChain', value: 'US$900M+', vuln: 'Integer Overflow', date: '2018', textFile: '2026-08-27-beautychain-hack.md', carouselFile: 'carousel-hack-03-beautychain.html' },
  { id: '04', name: 'bZx', value: 'US$8M', vuln: 'Flash Loan + Oracle', date: '2020', textFile: '2026-08-27-bzx-hack.md', carouselFile: 'carousel-hack-04-bzx.html' },
  { id: '05', name: 'Poly Network', value: 'US$611M', vuln: 'Cross-chain', date: '2021', textFile: '2026-08-27-poly-network-hack.md', carouselFile: 'carousel-hack-05-poly-network.html' },
  { id: '06', name: 'Cream Finance', value: 'US$130M', vuln: 'Flash Loan', date: '2021', textFile: '2026-08-27-cream-finance-hack.md', carouselFile: 'carousel-hack-06-cream-finance.html' },
  { id: '07', name: 'Ronin Bridge', value: 'US$625M', vuln: 'Key Compromise', date: '2022', textFile: '2026-08-27-ronin-bridge-hack.md', carouselFile: 'carousel-hack-07-ronin-bridge.html' },
  { id: '08', name: 'Akutars NFT', value: '11,539 ETH', vuln: 'State Bug', date: '2022', textFile: '2026-08-27-akutars-hack.md', carouselFile: 'carousel-hack-08-akutars.html' },
  { id: '09', name: 'Nomad Bridge', value: 'US$190M', vuln: 'Zero-hash', date: '2022', textFile: '2026-08-27-nomad-bridge-hack.md', carouselFile: 'carousel-hack-09-nomad-bridge.html' },
  { id: '10', name: 'Euler Finance', value: 'US$197M', vuln: 'Flash Loan + Donate', date: '2023', textFile: '2026-08-27-euler-finance-hack.md', carouselFile: 'carousel-hack-10-euler-finance.html' },
  { id: '11', name: 'Curve Finance', value: 'US$70M', vuln: 'Compiler Bug', date: '2023', textFile: '2026-08-27-curve-finance-hack.md', carouselFile: 'carousel-hack-11-curve-finance.html' },
];

const container = document.getElementById('cases');

function checkFile(path) {
  try {
    const x = new XMLHttpRequest();
    x.open('HEAD', path, false);
    x.send();
    return x.status >= 200 && x.status < 400;
  } catch { return false; }
}

function render() {
  let ready = 0;
  container.innerHTML = '';

  cases.forEach(c => {
    const textReady = checkFile('linkedin/posts/' + c.textFile);
    const carouselReady = checkFile(c.carouselFile);
    if (textReady) ready++;
    if (carouselReady) ready++;
    const allDone = textReady && carouselReady;

    const card = document.createElement('div');
    card.className = 'case-card' + (allDone ? ' done' : '');
    card.innerHTML = `
      <div class="case-num mono">${c.id}</div>
      <div class="case-info">
        <h3>${c.name} <span style="color:var(--muted);font-weight:400;font-size:0.8rem">${c.date}</span></h3>
        <div class="case-meta">
          <span class="case-value mono">${c.value}</span>
          <span class="case-vuln mono">${c.vuln}</span>
        </div>
      </div>
      <div class="status-chips">
        <span class="chip mono ${textReady ? 'ready' : 'working'}">texto ${textReady ? '✓' : '…'}</span>
        <span class="chip mono ${carouselReady ? 'ready' : 'working'}">carousel ${carouselReady ? '✓' : '…'}</span>
      </div>`;

    if (carouselReady) {
      card.style.cursor = 'pointer';
      card.addEventListener('click', () => window.open(c.carouselFile, '_blank'));
    }
    container.appendChild(card);
  });

  document.getElementById('pcount').textContent = ready;
  document.getElementById('pbar').style.width = ((ready / 22) * 100) + '%';
}

render();
setInterval(render, 5000);
</script>
