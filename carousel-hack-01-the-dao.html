<!doctype html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>The DAO — Security Incident</title><link rel="stylesheet" href="carousel/dist/app.css"></head><body><div id="root"></div><script>window.CAROUSEL_DATA={"slug":"the-dao","name":"The DAO","report":"REPORT 01","slides":["\n  \u003cspan class=\"slide-num\">01 / 05\u003c/span>\n  \u003cspan class=\"slide-label\">Report #01\u003c/span>\n  \u003cdiv class=\"date-badge\">17 Jun 2016\u003c/div>\n  \u003cdiv class=\"value\">US$ 60M\u003c/div>\n  \u003cdiv class=\"hack-name\">The DAO\u003c/div>\n  \u003cdiv class=\"headline\">\"O hack que dividiu o Ethereum ao meio\"\u003c/div>\n  \u003cspan class=\"severity-tag severity-critical\">REENTRANCY · CRITICAL\u003c/span>\n  \u003cp style=\"margin-top:24px;color:rgba(255,255,255,.4);font-size:15px\">3,6 milhões de ETH drenados em uma única transação\u003c/p>\n  \u003cdiv class=\"branding\">\u003cspan>Solbook · \u003cspan class=\"author-name\">Lucas Oliveira\u003c/span>\u003c/span>\u003cspan>linkedin.com/in/olivmath\u003c/span>\u003c/div>\n","\n  \u003cspan class=\"slide-num\">02 / 05\u003c/span>\n  \u003cspan class=\"slide-label\">A História\u003c/span>\n  \u003cdiv class=\"section-title\">O que aconteceu\u003c/div>\n  \u003cdiv class=\"story-text\">\n    \u003cstrong>The DAO\u003c/strong> era o maior fundo de investimento descentralizado da história em 2016 — arrecadou \u003cem>US$ 150 milhões\u003c/em> em ETH em apenas 28 dias.\n    \u003cbr>\u003cbr>\n    A ideia era simples: qualquer pessoa podia propor projetos e os investidores votavam. Quem discordasse podia sair via a função \u003cem>splitDAO\u003c/em>, recebendo seu ETH de volta.\n    \u003cbr>\u003cbr>\n    Um atacante descobriu que a função \u003cstrong>fazia a transferência antes de zerar o saldo\u003c/strong>. Com um contrato malicioso no fallback, ele \u003cem>reentrava\u003c/em> na função e sacava repetidamente.\n    \u003cbr>\u003cbr>\n    O Ethereum fez um \u003cstrong>hard fork\u003c/strong> para reverter o roubo — criando o Ethereum Classic (ETC) como a chain original.\n  \u003c/div>\n  \u003cdiv class=\"branding\">\u003cspan>Solbook · \u003cspan class=\"author-name\">Lucas Oliveira\u003c/span>\u003c/span>\u003cspan>linkedin.com/in/olivmath\u003c/span>\u003c/div>\n","\n  \u003cspan class=\"slide-num\">03 / 05\u003c/span>\n  \u003cspan class=\"slide-label\">O Código\u003c/span>\n  \u003cdiv class=\"section-title\">Contrato Vulnerável\u003c/div>\n  \u003cdiv class=\"vuln-label\">⚠️ LINHA VULNERÁVEL\u003c/div>\n  \u003ccode class=\"code-block\">\u003cspan class=\"kw\">function\u003c/span> \u003cspan class=\"fn\">splitDAO\u003c/span>(\u003cspan class=\"tp\">uint\u003c/span> _proposalID) {\n\n    \u003cspan class=\"cmt\">// 1. Calcula saldo do investidor\u003c/span>\n    \u003cspan class=\"tp\">uint\u003c/span> balance \u003cspan class=\"op\">=\u003c/span> balances[\u003cspan class=\"var\">msg.sender\u003c/span>];\n\n    \u003cspan class=\"cmt\">// 2. Envia ETH ANTES de zerar\u003c/span>\n\u003cspan class=\"vuln-line\">    \u003cspan class=\"var\">msg.sender\u003c/span>.\u003cspan class=\"fn\">call\u003c/span>.\u003cspan class=\"fn\">value\u003c/span>(balance)(\u003cspan class=\"str\">\"\"\u003c/span>);\u003c/span>\n\n    \u003cspan class=\"cmt\">// 3. Zera saldo DEPOIS (tarde demais)\u003c/span>\n    balances[\u003cspan class=\"var\">msg.sender\u003c/span>] \u003cspan class=\"op\">=\u003c/span> \u003cspan class=\"num\">0\u003c/span>;\n}\n\n\u003cspan class=\"cmt\">// O fallback do atacante:\u003c/span>\n\u003cspan class=\"kw\">fallback\u003c/span>() \u003cspan class=\"kw\">external\u003c/span> \u003cspan class=\"kw\">payable\u003c/span> {\n    dao.\u003cspan class=\"fn\">splitDAO\u003c/span>(proposalID); \u003cspan class=\"cmt\">// reentra!\u003c/span>\n}\n  \u003c/code>\n  \u003cdiv class=\"lesson-box\">\n    \u003cdiv class=\"lesson-label\">Lição\u003c/div>\n    \u003cp>Atualize o estado \u003cstrong>antes\u003c/strong> de qualquer chamada externa: \u003cspan class=\"lime\">Checks → Effects → Interactions\u003c/span>\u003c/p>\n  \u003c/div>\n  \u003cdiv class=\"branding\">\u003cspan>Solbook · \u003cspan class=\"author-name\">Lucas Oliveira\u003c/span>\u003c/span>\u003cspan>linkedin.com/in/olivmath\u003c/span>\u003c/div>\n","\n  \u003cspan class=\"slide-num\">04 / 05\u003c/span>\n  \u003cspan class=\"slide-label\">Análise Técnica\u003c/span>\n  \u003cdiv class=\"section-title\">Como o ataque funcionou\u003c/div>\n  \u003cdiv class=\"tech-flow\">\n    \u003cdiv class=\"step\">\u003cspan class=\"highlight\">PASSO 1\u003c/span>\u003c/div>\n    \u003cdiv class=\"step\">Atacante deposita ETH no DAO\u003c/div>\n    \u003cdiv class=\"step\">\u003cspan class=\"arrow\">↓\u003c/span>\u003c/div>\n    \u003cdiv class=\"step\">\u003cspan class=\"highlight\">PASSO 2\u003c/span>\u003c/div>\n    \u003cdiv class=\"step\">Chama splitDAO() para sacar\u003c/div>\n    \u003cdiv class=\"step\">\u003cspan class=\"arrow\">↓\u003c/span>\u003c/div>\n    \u003cdiv class=\"step\">\u003cspan class=\"highlight\">PASSO 3\u003c/span>\u003c/div>\n    \u003cdiv class=\"step\">DAO envia ETH → \u003cspan class=\"danger\">call.value(balance)()\u003c/span>\u003c/div>\n    \u003cdiv class=\"step\">\u003cspan class=\"arrow\">↓\u003c/span>\u003c/div>\n    \u003cdiv class=\"step\">\u003cspan class=\"highlight\">PASSO 4\u003c/span>\u003c/div>\n    \u003cdiv class=\"step\">fallback() do atacante é acionado\u003c/div>\n    \u003cdiv class=\"step\">\u003cspan class=\"arrow\">↓\u003c/span>\u003c/div>\n    \u003cdiv class=\"step\">\u003cspan class=\"highlight\">PASSO 5\u003c/span>\u003c/div>\n    \u003cdiv class=\"step\">\u003cspan class=\"danger\">fallback() chama splitDAO() novamente!\u003c/span>\u003c/div>\n    \u003cdiv class=\"step\">\u003cspan class=\"arrow\">↓\u003c/span>\u003c/div>\n    \u003cdiv class=\"step\">\u003cspan class=\"highlight\">PASSO 6\u003c/span>\u003c/div>\n    \u003cdiv class=\"step\">Saldo ainda não foi zerado → \u003cspan class=\"danger\">saca de novo\u003c/span>\u003c/div>\n    \u003cdiv class=\"step\">\u003cspan class=\"arrow\">↓\u003c/span>\u003c/div>\n    \u003cdiv class=\"step\">\u003cspan class=\"highlight\">LOOP\u003c/span> \u003cspan class=\"danger\">Repete até drenar o contrato\u003c/span>\u003c/div>\n  \u003c/div>\n  \u003cdiv class=\"branding\">\u003cspan>Solbook · \u003cspan class=\"author-name\">Lucas Oliveira\u003c/span>\u003c/span>\u003cspan>linkedin.com/in/olivmath\u003c/span>\u003c/div>\n","\n  \u003cspan class=\"slide-num\">05 / 05\u003c/span>\n  \u003cspan class=\"slide-label\">On-Chain\u003c/span>\n  \u003cdiv class=\"section-title\">Verifique na Blockchain\u003c/div>\n  \u003cdiv style=\"display:flex;gap:32px;align-items:flex-start\">\n    \u003cdiv style=\"flex:1\">\n      \u003ca class=\"link-card\" href=\"https://etherscan.io/tx/0x0ec3f2488a93839524add10ea229e773f6bc891b4eb4794c3337d4495263790b\" target=\"_blank\">\n        \u003cdiv>\n          \u003cdiv class=\"label\">Transação do Ataque\u003c/div>\n          \u003cdiv class=\"url\">etherscan.io/tx/0x0ec3f2...3790b\u003c/div>\n        \u003c/div>\n      \u003c/a>\n      \u003ca class=\"link-card\" href=\"https://etherscan.io/address/0xBB9bc244D798123fDe783fCc1C72d3Bb8C189413\" target=\"_blank\">\n        \u003cdiv>\n          \u003cdiv class=\"label\">Contrato The DAO\u003c/div>\n          \u003cdiv class=\"url\">etherscan.io/address/0xBB9bc...9413\u003c/div>\n        \u003c/div>\n      \u003c/a>\n      \u003ca class=\"link-card\" href=\"https://etherscan.io/address/0x304a554a310C7e546dfe434669C62820b7D83490\" target=\"_blank\">\n        \u003cdiv>\n          \u003cdiv class=\"label\">Dark DAO (atacante)\u003c/div>\n          \u003cdiv class=\"url\">etherscan.io/address/0x304a...3490\u003c/div>\n        \u003c/div>\n      \u003c/a>\n    \u003c/div>\n    \u003cimg src=\"landing-pages/livro/assets/book-cover-mockup.png\" alt=\"Solbook - Smartcontract Engineer\" class=\"book-cover\">\n  \u003c/div>\n  \u003cdiv class=\"cta-box\">\n    \u003ch3>Solbook — Smartcontract Engineer\u003c/h3>\n    \u003cp>Aprenda a se proteger contra reentrância e mais 23 tipos de ataque\u003c/p>\n  \u003c/div>\n  \u003cdiv class=\"branding\">\u003cspan>Solbook · \u003cspan class=\"author-name\">Lucas Oliveira\u003c/span>\u003c/span>\u003cspan>linkedin.com/in/olivmath\u003c/span>\u003c/div>\n"]}</script><script src="carousel/dist/app.js"></script></body></html>
