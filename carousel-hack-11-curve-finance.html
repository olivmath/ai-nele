<!doctype html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Curve Finance — Security Incident</title><link rel="stylesheet" href="carousel/dist/app.css"></head><body><div id="root"></div><script>window.CAROUSEL_DATA={"slug":"curve-finance","name":"Curve Finance","report":"REPORT 11","slides":["\n  \u003cspan class=\"slide-num\">01 / 05\u003c/span>\u003cspan class=\"slide-label\">Report #11\u003c/span>\n  \u003cdiv class=\"date-badge\">30 Jul 2023\u003c/div>\n  \u003cdiv class=\"value\">US$ 70M\u003c/div>\n  \u003cdiv class=\"hack-name\">Curve Finance\u003c/div>\n  \u003cdiv class=\"headline\">\"O código estava certo. O bytecode, não.\"\u003c/div>\n  \u003cspan class=\"severity-tag severity-critical\">COMPILER BUG · CRITICAL\u003c/span>\n  \u003cp style=\"margin-top:24px;color:rgba(255,255,255,.4);font-size:15px\">Bug no compilador Vyper — o reentrancy guard existia no código mas não no bytecode\u003c/p>\n  \u003cdiv class=\"branding\">\u003cspan>Solbook · \u003cspan class=\"author-name\">Lucas Oliveira\u003c/span>\u003c/span>\u003cspan>linkedin.com/in/olivmath\u003c/span>\u003c/div>\n","\n  \u003cspan class=\"slide-num\">02 / 05\u003c/span>\u003cspan class=\"slide-label\">A História\u003c/span>\n  \u003cdiv class=\"section-title\">O que aconteceu\u003c/div>\n  \u003cdiv class=\"story-text\">\n    \u003cstrong>Curve Finance\u003c/strong> é um dos maiores DEXs do ecossistema DeFi, escrito em \u003cem>Vyper\u003c/em> (alternativa ao Solidity para a EVM).\n    \u003cbr>\u003cbr>\n    Os desenvolvedores usaram o decorator \u003cem>@nonreentrant('lock')\u003c/em> — a forma correta de proteger funções contra reentrância em Vyper.\n    \u003cbr>\u003cbr>\n    O problema: versões do compilador Vyper entre \u003cstrong>0.2.15 e 0.3.0\u003c/strong> tinham um bug que fazia o reentrancy guard \u003cem>não ser incluído no bytecode gerado\u003c/em>.\n    \u003cbr>\u003cbr>\n    O código-fonte estava correto. A proteção estava declarada. Mas o \u003cstrong>bytecode compilado não tinha o lock\u003c/strong>. O atacante explorou essa falha via reentrância clássica em múltiplas pools.\n  \u003c/div>\n  \u003cdiv class=\"branding\">\u003cspan>Solbook · \u003cspan class=\"author-name\">Lucas Oliveira\u003c/span>\u003c/span>\u003cspan>linkedin.com/in/olivmath\u003c/span>\u003c/div>\n","\n  \u003cspan class=\"slide-num\">03 / 05\u003c/span>\u003cspan class=\"slide-label\">O Código\u003c/span>\n  \u003cdiv class=\"section-title\">Contrato Vulnerável (Vyper)\u003c/div>\n  \u003cdiv class=\"vuln-label\">⚠️ LINHA VULNERÁVEL\u003c/div>\n  \u003ccode class=\"code-block\">\u003cspan class=\"cmt\"># Vyper — Curve Pool\u003c/span>\n\n\u003cspan class=\"cmt\"># O decorator EXISTE no código-fonte:\u003c/span>\n\u003cspan class=\"vuln-line\">\u003cspan class=\"fn\">@nonreentrant\u003c/span>(\u003cspan class=\"str\">'lock'\u003c/span>)\u003c/span>\n\u003cspan class=\"fn\">@external\u003c/span>\n\u003cspan class=\"kw\">def\u003c/span> \u003cspan class=\"fn\">remove_liquidity\u003c/span>(\n    _amount: \u003cspan class=\"tp\">uint256\u003c/span>,\n    min_amounts: \u003cspan class=\"tp\">uint256\u003c/span>[N_COINS]\n) \u003cspan class=\"op\">->\u003c/span> \u003cspan class=\"tp\">uint256\u003c/span>[N_COINS]:\n    \u003cspan class=\"cmt\"># ... lógica de remoção ...\u003c/span>\n    \u003cspan class=\"kw\">pass\u003c/span>\n\n\u003cspan class=\"vuln-line\">\u003cspan class=\"cmt\"># MAS o compilador Vyper 0.2.15-0.3.0\u003c/span>\u003c/span>\n\u003cspan class=\"vuln-line\">\u003cspan class=\"cmt\"># NÃO gerava o lock no bytecode!\u003c/span>\u003c/span>\n\n\u003cspan class=\"cmt\"># Bytecode gerado: sem reentrancy guard\u003c/span>\n\u003cspan class=\"cmt\"># → Reentrância possível mesmo com\u003c/span>\n\u003cspan class=\"cmt\">#   @nonreentrant declarado\u003c/span>\n  \u003c/code>\n  \u003cdiv class=\"lesson-box\">\n    \u003cdiv class=\"lesson-label\">Lição\u003c/div>\n    \u003cp>\u003cspan class=\"lime\">Congele a versão do compilador\u003c/span> e \u003cspan class=\"lime\">teste o bytecode gerado\u003c/span> — o código-fonte nem sempre reflete o que roda on-chain.\u003c/p>\n  \u003c/div>\n  \u003cdiv class=\"branding\">\u003cspan>Solbook · \u003cspan class=\"author-name\">Lucas Oliveira\u003c/span>\u003c/span>\u003cspan>linkedin.com/in/olivmath\u003c/span>\u003c/div>\n","\n  \u003cspan class=\"slide-num\">04 / 05\u003c/span>\u003cspan class=\"slide-label\">Análise Técnica\u003c/span>\n  \u003cdiv class=\"section-title\">Como o ataque funcionou\u003c/div>\n  \u003cdiv class=\"tech-flow\">\n    \u003cdiv class=\"step\">\u003cspan class=\"highlight\">CONTEXTO\u003c/span>\u003c/div>\n    \u003cdiv class=\"step\">Curve pools compiladas com Vyper 0.2.15-0.3.0\u003c/div>\n    \u003cdiv class=\"step\">\u003cspan class=\"arrow\">↓\u003c/span>\u003c/div>\n    \u003cdiv class=\"step\">\u003cspan class=\"highlight\">PASSO 1\u003c/span>\u003c/div>\n    \u003cdiv class=\"step\">Atacante chama remove_liquidity()\u003c/div>\n    \u003cdiv class=\"step\">\u003cspan class=\"arrow\">↓\u003c/span>\u003c/div>\n    \u003cdiv class=\"step\">\u003cspan class=\"highlight\">PASSO 2\u003c/span>\u003c/div>\n    \u003cdiv class=\"step\">Pool envia ETH via callback\u003c/div>\n    \u003cdiv class=\"step\">\u003cspan class=\"arrow\">↓\u003c/span>\u003c/div>\n    \u003cdiv class=\"step\">\u003cspan class=\"highlight\">PASSO 3\u003c/span>\u003c/div>\n    \u003cdiv class=\"step\">@nonreentrant deveria bloquear...\u003c/div>\n    \u003cdiv class=\"step\">\u003cspan class=\"danger\">MAS o lock não existe no bytecode!\u003c/span>\u003c/div>\n    \u003cdiv class=\"step\">\u003cspan class=\"arrow\">↓\u003c/span>\u003c/div>\n    \u003cdiv class=\"step\">\u003cspan class=\"highlight\">PASSO 4\u003c/span>\u003c/div>\n    \u003cdiv class=\"step\">Atacante reentra via \u003cspan class=\"danger\">add_liquidity()\u003c/span>\u003c/div>\n    \u003cdiv class=\"step\">Estado inconsistente → preço manipulado\u003c/div>\n    \u003cdiv class=\"step\">\u003cspan class=\"arrow\">↓\u003c/span>\u003c/div>\n    \u003cdiv class=\"step\">\u003cspan class=\"highlight\">RESULTADO\u003c/span>\u003c/div>\n    \u003cdiv class=\"step\">\u003cspan class=\"danger\">US$70M drenados de múltiplas pools\u003c/span>\u003c/div>\n    \u003cdiv class=\"step\">alETH-ETH, msETH-ETH, pETH-ETH afetadas\u003c/div>\n  \u003c/div>\n  \u003cdiv class=\"branding\">\u003cspan>Solbook · \u003cspan class=\"author-name\">Lucas Oliveira\u003c/span>\u003c/span>\u003cspan>linkedin.com/in/olivmath\u003c/span>\u003c/div>\n","\n  \u003cspan class=\"slide-num\">05 / 05\u003c/span>\u003cspan class=\"slide-label\">On-Chain\u003c/span>\n  \u003cdiv class=\"section-title\">Verifique na Blockchain\u003c/div>\n  \u003cdiv style=\"display:flex;gap:32px;align-items:flex-start\">\n    \u003cdiv style=\"flex:1\">\n      \u003ca class=\"link-card\" href=\"https://etherscan.io/tx/0xa84aa065ce61dbb1eb50ab6ae67fc31a9da50dd2c74eefd561661bfce2f1620c\" target=\"_blank\">\n        \u003cdiv>\u003cdiv class=\"label\">Transação do Ataque\u003c/div>\u003cdiv class=\"url\">etherscan.io/tx/0xa84aa0...620c\u003c/div>\u003c/div>\n      \u003c/a>\n      \u003ca class=\"link-card\" href=\"https://etherscan.io/address/0xc4C319E2D4d66CcA4464C0c2B32c9Bd23ebe784e\" target=\"_blank\">\n        \u003cdiv>\u003cdiv class=\"label\">Curve alETH Pool\u003c/div>\u003cdiv class=\"url\">etherscan.io/address/0xc4C31...784e\u003c/div>\u003c/div>\n      \u003c/a>\n    \u003c/div>\n    \u003cimg src=\"landing-pages/livro/assets/book-cover-mockup.png\" alt=\"Solbook - Smartcontract Engineer\" class=\"book-cover\">\n  \u003c/div>\n  \u003cdiv class=\"cta-box\">\n    \u003ch3>Solbook — Smartcontract Engineer\u003c/h3>\n    \u003cp>Entenda a stack completa de segurança — do código-fonte ao bytecode\u003c/p>\n  \u003c/div>\n  \u003cdiv class=\"branding\">\u003cspan>Solbook · \u003cspan class=\"author-name\">Lucas Oliveira\u003c/span>\u003c/span>\u003cspan>linkedin.com/in/olivmath\u003c/span>\u003c/div>\n"]}</script><script src="carousel/dist/app.js"></script></body></html>
