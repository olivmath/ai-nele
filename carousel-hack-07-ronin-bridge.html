<!doctype html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Ronin Bridge — Security Incident</title><link rel="stylesheet" href="carousel/dist/app.css"></head><body><div id="root"></div><script>window.CAROUSEL_DATA={"slug":"ronin-bridge","name":"Ronin Bridge","report":"REPORT 07","slides":["\n  \u003cspan class=\"slide-num\">01 / 05\u003c/span>\u003cspan class=\"slide-label\">Report #07\u003c/span>\n  \u003cdiv class=\"date-badge\">23 Mar 2022\u003c/div>\n  \u003cdiv class=\"value\">US$ 625M\u003c/div>\n  \u003cdiv class=\"hack-name\">Ronin Bridge\u003c/div>\n  \u003cdiv class=\"headline\">\"Um PDF malicioso custou US$625M\"\u003c/div>\n  \u003cspan class=\"severity-tag severity-critical\">VALIDATOR KEY COMPROMISE · CRITICAL\u003c/span>\n  \u003cp style=\"margin-top:24px;color:rgba(255,255,255,.4);font-size:15px\">O maior hack de DeFi — atribuído ao grupo Lazarus (Coreia do Norte)\u003c/p>\n  \u003cdiv class=\"branding\">\u003cspan>Solbook · \u003cspan class=\"author-name\">Lucas Oliveira\u003c/span>\u003c/span>\u003cspan>linkedin.com/in/olivmath\u003c/span>\u003c/div>\n","\n  \u003cspan class=\"slide-num\">02 / 05\u003c/span>\u003cspan class=\"slide-label\">A História\u003c/span>\n  \u003cdiv class=\"section-title\">O que aconteceu\u003c/div>\n  \u003cdiv class=\"story-text\">\n    \u003cstrong>Ronin Network\u003c/strong> era a sidechain do \u003cem>Axie Infinity\u003c/em>, o maior jogo play-to-earn do mundo na época, com bilhões em TVL.\n    \u003cbr>\u003cbr>\n    A bridge usava um modelo de \u003cstrong>multisig 5/9\u003c/strong> — precisava de 5 validadores assinando para autorizar retiradas.\n    \u003cbr>\u003cbr>\n    O grupo \u003cem>Lazarus\u003c/em> (APT norte-coreano) enviou um \u003cstrong>PDF com oferta de emprego falsa\u003c/strong> para engenheiros da Sky Mavis. O malware comprometeu \u003cem>4 chaves\u003c/em> de validadores.\n    \u003cbr>\u003cbr>\n    A 5ª chave veio da \u003cem>Axie DAO\u003c/em>, que tinha dado permissão temporária à Sky Mavis meses antes — e \u003cstrong>nunca revogou\u003c/strong>. O hack só foi descoberto \u003cem>6 dias depois\u003c/em>, quando um usuário tentou sacar.\n  \u003c/div>\n  \u003cdiv class=\"branding\">\u003cspan>Solbook · \u003cspan class=\"author-name\">Lucas Oliveira\u003c/span>\u003c/span>\u003cspan>linkedin.com/in/olivmath\u003c/span>\u003c/div>\n","\n  \u003cspan class=\"slide-num\">03 / 05\u003c/span>\u003cspan class=\"slide-label\">O Código\u003c/span>\n  \u003cdiv class=\"section-title\">Contrato Vulnerável\u003c/div>\n  \u003cdiv class=\"vuln-label\">⚠️ LINHA VULNERÁVEL\u003c/div>\n  \u003ccode class=\"code-block\">\u003cspan class=\"cmt\">// Ronin Bridge Validator\u003c/span>\n\u003cspan class=\"kw\">contract\u003c/span> \u003cspan class=\"fn\">RoninBridge\u003c/span> {\n    \u003cspan class=\"tp\">uint256\u003c/span> \u003cspan class=\"kw\">public\u003c/span> threshold;  \u003cspan class=\"cmt\">// 5\u003c/span>\n    \u003cspan class=\"tp\">uint256\u003c/span> \u003cspan class=\"kw\">public\u003c/span> validatorCount; \u003cspan class=\"cmt\">// 9\u003c/span>\n\n    \u003cspan class=\"kw\">function\u003c/span> \u003cspan class=\"fn\">submitWithdrawal\u003c/span>(\n        \u003cspan class=\"tp\">bytes\u003c/span>[] \u003cspan class=\"kw\">calldata\u003c/span> signatures\n    ) \u003cspan class=\"kw\">external\u003c/span> {\n\n        \u003cspan class=\"cmt\">// 5 de 9 validadores necessários\u003c/span>\n\u003cspan class=\"vuln-line\">        \u003cspan class=\"kw\">require\u003c/span>(\u003c/span>\n\u003cspan class=\"vuln-line\">            signatures.length \u003cspan class=\"op\">>=\u003c/span> threshold,\u003c/span>\n\u003cspan class=\"vuln-line\">            \u003cspan class=\"str\">\"not enough signatures\"\u003c/span>\u003c/span>\n\u003cspan class=\"vuln-line\">        );\u003c/span>\n\n        \u003cspan class=\"cmt\">// 4 da Sky Mavis + 1 da Axie DAO\u003c/span>\n        \u003cspan class=\"cmt\">// = 5 chaves comprometidas\u003c/span>\n        \u003cspan class=\"cmt\">// = controle total\u003c/span>\n    }\n}\n  \u003c/code>\n  \u003cdiv class=\"lesson-box\">\n    \u003cdiv class=\"lesson-label\">Lição\u003c/div>\n    \u003cp>\u003cspan class=\"lime\">Segurança operacional\u003c/span> é tão crítica quanto código. Diversifique validadores, revogue permissões temporárias, monitore on-chain.\u003c/p>\n  \u003c/div>\n  \u003cdiv class=\"branding\">\u003cspan>Solbook · \u003cspan class=\"author-name\">Lucas Oliveira\u003c/span>\u003c/span>\u003cspan>linkedin.com/in/olivmath\u003c/span>\u003c/div>\n","\n  \u003cspan class=\"slide-num\">04 / 05\u003c/span>\u003cspan class=\"slide-label\">Análise Técnica\u003c/span>\n  \u003cdiv class=\"section-title\">Como o ataque funcionou\u003c/div>\n  \u003cdiv class=\"tech-flow\">\n    \u003cdiv class=\"step\">\u003cspan class=\"highlight\">PASSO 1\u003c/span>\u003c/div>\n    \u003cdiv class=\"step\">Oferta de emprego falsa (LinkedIn) → \u003cspan class=\"danger\">PDF malicioso\u003c/span>\u003c/div>\n    \u003cdiv class=\"step\">\u003cspan class=\"arrow\">↓\u003c/span>\u003c/div>\n    \u003cdiv class=\"step\">\u003cspan class=\"highlight\">PASSO 2\u003c/span>\u003c/div>\n    \u003cdiv class=\"step\">Malware compromete 4 validadores da Sky Mavis\u003c/div>\n    \u003cdiv class=\"step\">\u003cspan class=\"arrow\">↓\u003c/span>\u003c/div>\n    \u003cdiv class=\"step\">\u003cspan class=\"highlight\">PASSO 3\u003c/span>\u003c/div>\n    \u003cdiv class=\"step\">5ª chave: \u003cspan class=\"danger\">Axie DAO (permissão nunca revogada)\u003c/span>\u003c/div>\n    \u003cdiv class=\"step\">\u003cspan class=\"arrow\">↓\u003c/span>\u003c/div>\n    \u003cdiv class=\"step\">\u003cspan class=\"highlight\">PASSO 4\u003c/span>\u003c/div>\n    \u003cdiv class=\"step\">5/9 validadores = \u003cspan class=\"danger\">threshold atingido\u003c/span>\u003c/div>\n    \u003cdiv class=\"step\">\u003cspan class=\"arrow\">↓\u003c/span>\u003c/div>\n    \u003cdiv class=\"step\">\u003cspan class=\"highlight\">PASSO 5\u003c/span>\u003c/div>\n    \u003cdiv class=\"step\">Duas transações de saque:\u003c/div>\n    \u003cdiv class=\"step\">\u003cspan class=\"danger\">173.600 ETH + 25,5M USDC\u003c/span>\u003c/div>\n    \u003cdiv class=\"step\">\u003cspan class=\"arrow\">↓\u003c/span>\u003c/div>\n    \u003cdiv class=\"step\">\u003cspan class=\"highlight\">RESULTADO\u003c/span>\u003c/div>\n    \u003cdiv class=\"step\">Hack descoberto \u003cspan class=\"danger\">6 DIAS depois\u003c/span>\u003c/div>\n    \u003cdiv class=\"step\">Atribuído ao grupo Lazarus (Coreia do Norte)\u003c/div>\n  \u003c/div>\n  \u003cdiv class=\"branding\">\u003cspan>Solbook · \u003cspan class=\"author-name\">Lucas Oliveira\u003c/span>\u003c/span>\u003cspan>linkedin.com/in/olivmath\u003c/span>\u003c/div>\n","\n  \u003cspan class=\"slide-num\">05 / 05\u003c/span>\u003cspan class=\"slide-label\">On-Chain\u003c/span>\n  \u003cdiv class=\"section-title\">Verifique na Blockchain\u003c/div>\n  \u003cdiv style=\"display:flex;gap:32px;align-items:flex-start\">\n    \u003cdiv style=\"flex:1\">\n      \u003ca class=\"link-card\" href=\"https://etherscan.io/tx/0xc28fad5e8d5e0ce6a2eaf67b6687be5d58a9c785c34f0df4e0c492f71e3ec102\" target=\"_blank\">\n        \u003cdiv>\u003cdiv class=\"label\">Transação do Ataque\u003c/div>\u003cdiv class=\"url\">etherscan.io/tx/0xc28fad...ec102\u003c/div>\u003c/div>\n      \u003c/a>\n      \u003ca class=\"link-card\" href=\"https://etherscan.io/address/0x098B716B8Aaf21512996dC57EB0615e2383E2f96\" target=\"_blank\">\n        \u003cdiv>\u003cdiv class=\"label\">Endereço do Atacante\u003c/div>\u003cdiv class=\"url\">etherscan.io/address/0x098B7...2f96\u003c/div>\u003c/div>\n      \u003c/a>\n    \u003c/div>\n    \u003cimg src=\"landing-pages/livro/assets/book-cover-mockup.png\" alt=\"Solbook - Smartcontract Engineer\" class=\"book-cover\">\n  \u003c/div>\n  \u003cdiv class=\"cta-box\">\n    \u003ch3>Solbook — Smartcontract Engineer\u003c/h3>\n    \u003cp>Segurança vai além do código — aprenda threat modeling completo\u003c/p>\n  \u003c/div>\n  \u003cdiv class=\"branding\">\u003cspan>Solbook · \u003cspan class=\"author-name\">Lucas Oliveira\u003c/span>\u003c/span>\u003cspan>linkedin.com/in/olivmath\u003c/span>\u003c/div>\n"]}</script><script src="carousel/dist/app.js"></script></body></html>
