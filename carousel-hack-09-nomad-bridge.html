<!doctype html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Nomad Bridge — Security Incident</title><link rel="stylesheet" href="carousel/dist/app.css"></head><body><div id="root"></div><script>window.CAROUSEL_DATA={"slug":"nomad-bridge","name":"Nomad Bridge","report":"REPORT 09","slides":["\n  \u003cspan class=\"slide-num\">01 / 05\u003c/span>\u003cspan class=\"slide-label\">Report #09\u003c/span>\n  \u003cdiv class=\"date-badge\">1 Ago 2022\u003c/div>\n  \u003cdiv class=\"value\">US$ 190M\u003c/div>\n  \u003cdiv class=\"hack-name\">Nomad Bridge\u003c/div>\n  \u003cdiv class=\"headline\">\"O primeiro hack 'democrático' — centenas copiaram\"\u003c/div>\n  \u003cspan class=\"severity-tag severity-critical\">ZERO-HASH BYPASS · CRITICAL\u003c/span>\n  \u003cp style=\"margin-top:24px;color:rgba(255,255,255,.4);font-size:15px\">Após o exploit inicial, centenas de pessoas copiaram a transação e drenaram o resto\u003c/p>\n  \u003cdiv class=\"branding\">\u003cspan>Solbook · \u003cspan class=\"author-name\">Lucas Oliveira\u003c/span>\u003c/span>\u003cspan>linkedin.com/in/olivmath\u003c/span>\u003c/div>\n","\n  \u003cspan class=\"slide-num\">02 / 05\u003c/span>\u003cspan class=\"slide-label\">A História\u003c/span>\n  \u003cdiv class=\"section-title\">O que aconteceu\u003c/div>\n  \u003cdiv class=\"story-text\">\n    \u003cstrong>Nomad\u003c/strong> era uma bridge cross-chain que usava \u003cem>optimistic verification\u003c/em> — um modelo onde mensagens são aceitas após um período sem disputa.\n    \u003cbr>\u003cbr>\n    Um upgrade de rotina \u003cstrong>inicializou o trusted root como 0x00\u003c/strong>. O contrato usava \u003cem>mapping\u003c/em> para checar se um root era aceito — e em Solidity, valores não-inicializados retornam \u003cem>0\u003c/em>.\n    \u003cbr>\u003cbr>\n    Resultado: \u003cstrong>acceptableRoot[0x00] = true\u003c/strong> por padrão. Qualquer mensagem com root 0x00 era válida.\n    \u003cbr>\u003cbr>\n    O mais surpreendente: após o primeiro exploit, \u003cstrong>centenas de pessoas\u003c/strong> simplesmente copiaram a transação, trocando apenas o endereço de destino, e drenaram os US$190M restantes.\n  \u003c/div>\n  \u003cdiv class=\"branding\">\u003cspan>Solbook · \u003cspan class=\"author-name\">Lucas Oliveira\u003c/span>\u003c/span>\u003cspan>linkedin.com/in/olivmath\u003c/span>\u003c/div>\n","\n  \u003cspan class=\"slide-num\">03 / 05\u003c/span>\u003cspan class=\"slide-label\">O Código\u003c/span>\n  \u003cdiv class=\"section-title\">Contrato Vulnerável\u003c/div>\n  \u003cdiv class=\"vuln-label\">⚠️ LINHA VULNERÁVEL\u003c/div>\n  \u003ccode class=\"code-block\">\u003cspan class=\"kw\">contract\u003c/span> \u003cspan class=\"tp\">NomadReplica\u003c/span> {\n    \u003cspan class=\"cmt\">// Após upgrade: confirmAt[0x00] = 1\u003c/span>\n    \u003cspan class=\"tp\">mapping\u003c/span>(\u003cspan class=\"tp\">bytes32\u003c/span> \u003cspan class=\"op\">=>\u003c/span> \u003cspan class=\"tp\">uint256\u003c/span>) confirmAt;\n\n    \u003cspan class=\"kw\">function\u003c/span> \u003cspan class=\"fn\">process\u003c/span>(\n        \u003cspan class=\"tp\">bytes\u003c/span> \u003cspan class=\"kw\">memory\u003c/span> _message\n    ) \u003cspan class=\"kw\">public\u003c/span> \u003cspan class=\"kw\">returns\u003c/span> (\u003cspan class=\"tp\">bool\u003c/span>) {\n        \u003cspan class=\"tp\">bytes32\u003c/span> _root \u003cspan class=\"op\">=\u003c/span> ...;\n\n        \u003cspan class=\"cmt\">// 0x00 sempre existe no mapping!\u003c/span>\n\u003cspan class=\"vuln-line\">        \u003cspan class=\"fn\">require\u003c/span>(\u003c/span>\n\u003cspan class=\"vuln-line\">            \u003cspan class=\"fn\">acceptableRoot\u003c/span>(_root),\u003c/span>\n\u003cspan class=\"vuln-line\">            \u003cspan class=\"str\">\"not accepted root\"\u003c/span>\u003c/span>\n\u003cspan class=\"vuln-line\">        );\u003c/span>\n\n        \u003cspan class=\"cmt\">// acceptableRoot(0x00) → TRUE\u003c/span>\n        \u003cspan class=\"cmt\">// Qualquer mensagem é válida!\u003c/span>\n\n        \u003cspan class=\"fn\">_send\u003c/span>(_message);\n    }\n}\n  \u003c/code>\n  \u003cdiv class=\"lesson-box\">\n    \u003cdiv class=\"lesson-label\">Lição\u003c/div>\n    \u003cp>Testes de invariante devem cobrir \u003cspan class=\"lime\">estado pós-upgrade\u003c/span>. Nunca confie em valores default de mappings para segurança.\u003c/p>\n  \u003c/div>\n  \u003cdiv class=\"branding\">\u003cspan>Solbook · \u003cspan class=\"author-name\">Lucas Oliveira\u003c/span>\u003c/span>\u003cspan>linkedin.com/in/olivmath\u003c/span>\u003c/div>\n","\n  \u003cspan class=\"slide-num\">04 / 05\u003c/span>\u003cspan class=\"slide-label\">Análise Técnica\u003c/span>\n  \u003cdiv class=\"section-title\">Como o ataque funcionou\u003c/div>\n  \u003cdiv class=\"tech-flow\">\n    \u003cdiv class=\"step\">\u003cspan class=\"highlight\">PASSO 1\u003c/span>\u003c/div>\n    \u003cdiv class=\"step\">Upgrade de rotina no contrato Replica\u003c/div>\n    \u003cdiv class=\"step\">\u003cspan class=\"arrow\">↓\u003c/span>\u003c/div>\n    \u003cdiv class=\"step\">\u003cspan class=\"highlight\">PASSO 2\u003c/span>\u003c/div>\n    \u003cdiv class=\"step\">Trusted root inicializado como \u003cspan class=\"danger\">0x00\u003c/span>\u003c/div>\n    \u003cdiv class=\"step\">\u003cspan class=\"arrow\">↓\u003c/span>\u003c/div>\n    \u003cdiv class=\"step\">\u003cspan class=\"highlight\">PASSO 3\u003c/span>\u003c/div>\n    \u003cdiv class=\"step\">mapping(0x00) → default uint256 = 0\u003c/div>\n    \u003cdiv class=\"step\">confirmAt[0x00] setado como 1 no upgrade\u003c/div>\n    \u003cdiv class=\"step\">\u003cspan class=\"danger\">acceptableRoot(0x00) = TRUE\u003c/span>\u003c/div>\n    \u003cdiv class=\"step\">\u003cspan class=\"arrow\">↓\u003c/span>\u003c/div>\n    \u003cdiv class=\"step\">\u003cspan class=\"highlight\">PASSO 4\u003c/span>\u003c/div>\n    \u003cdiv class=\"step\">Atacante envia mensagem com root 0x00\u003c/div>\n    \u003cdiv class=\"step\">\u003cspan class=\"lime\">require(acceptableRoot) → PASSA\u003c/span>\u003c/div>\n    \u003cdiv class=\"step\">\u003cspan class=\"arrow\">↓\u003c/span>\u003c/div>\n    \u003cdiv class=\"step\">\u003cspan class=\"highlight\">PASSO 5\u003c/span>\u003c/div>\n    \u003cdiv class=\"step\">\u003cspan class=\"danger\">Centenas copiam a tx, trocam endereço\u003c/span>\u003c/div>\n    \u003cdiv class=\"step\">\u003cspan class=\"danger\">\"Hack democrático\" — US$190M drenados\u003c/span>\u003c/div>\n  \u003c/div>\n  \u003cdiv class=\"branding\">\u003cspan>Solbook · \u003cspan class=\"author-name\">Lucas Oliveira\u003c/span>\u003c/span>\u003cspan>linkedin.com/in/olivmath\u003c/span>\u003c/div>\n","\n  \u003cspan class=\"slide-num\">05 / 05\u003c/span>\u003cspan class=\"slide-label\">On-Chain\u003c/span>\n  \u003cdiv class=\"section-title\">Verifique na Blockchain\u003c/div>\n  \u003cdiv style=\"display:flex;gap:32px;align-items:flex-start\">\n    \u003cdiv style=\"flex:1\">\n      \u003ca class=\"link-card\" href=\"https://etherscan.io/tx/0xa5fe9d044e4f3e5e5bec0caa7f2c0c1bb38bf49eab4c17c386ff14f2e01a6c2e\" target=\"_blank\">\n        \u003cdiv>\u003cdiv class=\"label\">Uma das transações do Ataque\u003c/div>\u003cdiv class=\"url\">etherscan.io/tx/0xa5fe9d...6c2e\u003c/div>\u003c/div>\n      \u003c/a>\n      \u003ca class=\"link-card\" href=\"https://etherscan.io/address/0xB92336759618F55bd0F8313bd843604592E27bd8\" target=\"_blank\">\n        \u003cdiv>\u003cdiv class=\"label\">Contrato Nomad Replica\u003c/div>\u003cdiv class=\"url\">etherscan.io/address/0xB9233...7bd8\u003c/div>\u003c/div>\n      \u003c/a>\n    \u003c/div>\n    \u003cimg src=\"landing-pages/livro/assets/book-cover-mockup.png\" alt=\"Solbook - Smartcontract Engineer\" class=\"book-cover\">\n  \u003c/div>\n  \u003cdiv class=\"cta-box\">\n    \u003ch3>Solbook — Smartcontract Engineer\u003c/h3>\n    \u003cp>Entenda por que upgrades são o momento mais perigoso de um contrato\u003c/p>\n  \u003c/div>\n  \u003cdiv class=\"branding\">\u003cspan>Solbook · \u003cspan class=\"author-name\">Lucas Oliveira\u003c/span>\u003c/span>\u003cspan>linkedin.com/in/olivmath\u003c/span>\u003c/div>\n"]}</script><script src="carousel/dist/app.js"></script></body></html>
