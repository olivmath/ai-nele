<!doctype html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Euler Finance — Security Incident</title><link rel="stylesheet" href="carousel/dist/app.css"></head><body><div id="root"></div><script>window.CAROUSEL_DATA={"slug":"euler-finance","name":"Euler Finance","report":"REPORT 10","slides":["\n  \u003cspan class=\"slide-num\">01 / 05\u003c/span>\u003cspan class=\"slide-label\">Report #10\u003c/span>\n  \u003cdiv class=\"date-badge\">13 Mar 2023\u003c/div>\n  \u003cdiv class=\"value\">US$ 197M\u003c/div>\n  \u003cdiv class=\"hack-name\">Euler Finance\u003c/div>\n  \u003cdiv class=\"headline\">\"Dez auditorias e nenhuma pegou\"\u003c/div>\n  \u003cspan class=\"severity-tag severity-critical\">FLASH LOAN + DONATE · CRITICAL\u003c/span>\n  \u003cp style=\"margin-top:24px;color:rgba(255,255,255,.4);font-size:15px\">Auditado por 10 firmas diferentes — 100% devolvido após negociação\u003c/p>\n  \u003cdiv class=\"branding\">\u003cspan>Solbook · \u003cspan class=\"author-name\">Lucas Oliveira\u003c/span>\u003c/span>\u003cspan>linkedin.com/in/olivmath\u003c/span>\u003c/div>\n","\n  \u003cspan class=\"slide-num\">02 / 05\u003c/span>\u003cspan class=\"slide-label\">A História\u003c/span>\n  \u003cdiv class=\"section-title\">O que aconteceu\u003c/div>\n  \u003cdiv class=\"story-text\">\n    \u003cstrong>Euler Finance\u003c/strong> era um dos protocolos de lending mais sofisticados do DeFi, com \u003cem>10 auditorias\u003c/em> de segurança de firmas renomadas.\n    \u003cbr>\u003cbr>\n    O atacante encontrou uma função chamada \u003cem>donateToReserves\u003c/em> que permitia \"doar\" tokens para as reservas do protocolo. O problema: \u003cstrong>não verificava se o doador continuava solvente\u003c/strong>.\n    \u003cbr>\u003cbr>\n    Com flash loans, o atacante tomou empréstimos, \u003cstrong>doou o colateral para as reservas\u003c/strong> (ficando artificialmente insolvente), e então se auto-liquidou com \u003cem>desconto de liquidação\u003c/em>.\n    \u003cbr>\u003cbr>\n    Após negociações, incluindo ameaças de ação legal e comunicação on-chain via mensagens em transações, o atacante \u003cstrong>devolveu 100% dos fundos\u003c/strong>.\n  \u003c/div>\n  \u003cdiv class=\"branding\">\u003cspan>Solbook · \u003cspan class=\"author-name\">Lucas Oliveira\u003c/span>\u003c/span>\u003cspan>linkedin.com/in/olivmath\u003c/span>\u003c/div>\n","\n  \u003cspan class=\"slide-num\">03 / 05\u003c/span>\u003cspan class=\"slide-label\">O Código\u003c/span>\n  \u003cdiv class=\"section-title\">Contrato Vulnerável\u003c/div>\n  \u003cdiv class=\"vuln-label\">⚠️ LINHA VULNERÁVEL\u003c/div>\n  \u003ccode class=\"code-block\">\u003cspan class=\"kw\">function\u003c/span> \u003cspan class=\"fn\">donateToReserves\u003c/span>(\n    \u003cspan class=\"tp\">address\u003c/span> underlying,\n    \u003cspan class=\"tp\">uint\u003c/span> amount\n) \u003cspan class=\"kw\">external\u003c/span> {\n    \u003cspan class=\"tp\">AssetStorage\u003c/span> \u003cspan class=\"kw\">storage\u003c/span> s \u003cspan class=\"op\">=\u003c/span>\n        eTokenLookup[underlying];\n\n    \u003cspan class=\"cmt\">// Transfere do usuário para reservas\u003c/span>\n    s.users[\u003cspan class=\"var\">msg.sender\u003c/span>].balance \u003cspan class=\"op\">-=\u003c/span> amount;\n\u003cspan class=\"vuln-line\">    s.reserveBalance \u003cspan class=\"op\">+=\u003c/span> amount;\u003c/span>\n\n\u003cspan class=\"vuln-line\">    \u003cspan class=\"cmt\">// FALTA: checkLiquidity(msg.sender)\u003c/span>\u003c/span>\n    \u003cspan class=\"cmt\">// Doador pode ficar insolvente!\u003c/span>\n    \u003cspan class=\"cmt\">// → se auto-liquida com desconto\u003c/span>\n}\n  \u003c/code>\n  \u003cdiv class=\"lesson-box\">\n    \u003cdiv class=\"lesson-label\">Lição\u003c/div>\n    \u003cp>Toda função que altera colateral ou dívida \u003cspan class=\"lime\">precisa verificar solvência\u003c/span> ao final. Auditorias não são garantia.\u003c/p>\n  \u003c/div>\n  \u003cdiv class=\"branding\">\u003cspan>Solbook · \u003cspan class=\"author-name\">Lucas Oliveira\u003c/span>\u003c/span>\u003cspan>linkedin.com/in/olivmath\u003c/span>\u003c/div>\n","\n  \u003cspan class=\"slide-num\">04 / 05\u003c/span>\u003cspan class=\"slide-label\">Análise Técnica\u003c/span>\n  \u003cdiv class=\"section-title\">Como o ataque funcionou\u003c/div>\n  \u003cdiv class=\"tech-flow\">\n    \u003cdiv class=\"step\">\u003cspan class=\"highlight\">PASSO 1\u003c/span>\u003c/div>\n    \u003cdiv class=\"step\">Flash loan de 30M DAI\u003c/div>\n    \u003cdiv class=\"step\">\u003cspan class=\"arrow\">↓\u003c/span>\u003c/div>\n    \u003cdiv class=\"step\">\u003cspan class=\"highlight\">PASSO 2\u003c/span>\u003c/div>\n    \u003cdiv class=\"step\">Deposita 20M DAI no Euler → recebe eDAI\u003c/div>\n    \u003cdiv class=\"step\">\u003cspan class=\"arrow\">↓\u003c/span>\u003c/div>\n    \u003cdiv class=\"step\">\u003cspan class=\"highlight\">PASSO 3\u003c/span>\u003c/div>\n    \u003cdiv class=\"step\">Toma empréstimo de 195M eDAI (10x alavancado)\u003c/div>\n    \u003cdiv class=\"step\">\u003cspan class=\"arrow\">↓\u003c/span>\u003c/div>\n    \u003cdiv class=\"step\">\u003cspan class=\"highlight\">PASSO 4\u003c/span>\u003c/div>\n    \u003cdiv class=\"step\">Chama \u003cspan class=\"danger\">donateToReserves(100M)\u003c/span>\u003c/div>\n    \u003cdiv class=\"step\">Colateral cai → fica artificialmente insolvente\u003c/div>\n    \u003cdiv class=\"step\">\u003cspan class=\"arrow\">↓\u003c/span>\u003c/div>\n    \u003cdiv class=\"step\">\u003cspan class=\"highlight\">PASSO 5\u003c/span>\u003c/div>\n    \u003cdiv class=\"step\">Contrato 2 \u003cspan class=\"danger\">liquida Contrato 1\u003c/span>\u003c/div>\n    \u003cdiv class=\"step\">Recebe colateral com desconto de liquidação\u003c/div>\n    \u003cdiv class=\"step\">\u003cspan class=\"arrow\">↓\u003c/span>\u003c/div>\n    \u003cdiv class=\"step\">\u003cspan class=\"highlight\">RESULTADO\u003c/span>\u003c/div>\n    \u003cdiv class=\"step\">\u003cspan class=\"danger\">Lucro: US$197M\u003c/span>\u003c/div>\n    \u003cdiv class=\"step\">\u003cspan class=\"lime\">Devolveu 100% após negociação\u003c/span>\u003c/div>\n  \u003c/div>\n  \u003cdiv class=\"branding\">\u003cspan>Solbook · \u003cspan class=\"author-name\">Lucas Oliveira\u003c/span>\u003c/span>\u003cspan>linkedin.com/in/olivmath\u003c/span>\u003c/div>\n","\n  \u003cspan class=\"slide-num\">05 / 05\u003c/span>\u003cspan class=\"slide-label\">On-Chain\u003c/span>\n  \u003cdiv class=\"section-title\">Verifique na Blockchain\u003c/div>\n  \u003cdiv style=\"display:flex;gap:32px;align-items:flex-start\">\n    \u003cdiv style=\"flex:1\">\n      \u003ca class=\"link-card\" href=\"https://etherscan.io/tx/0xc310a0affe2169d1f6feec1c63dbc7f7c62a887fa48795d327d4d2da2d6b111d\" target=\"_blank\">\n        \u003cdiv>\u003cdiv class=\"label\">Transação do Ataque\u003c/div>\u003cdiv class=\"url\">etherscan.io/tx/0xc310a0...111d\u003c/div>\u003c/div>\n      \u003c/a>\n      \u003ca class=\"link-card\" href=\"https://etherscan.io/address/0x27182842E098f60e3D576794A5bFFb0777E025d3\" target=\"_blank\">\n        \u003cdiv>\u003cdiv class=\"label\">Contrato Euler\u003c/div>\u003cdiv class=\"url\">etherscan.io/address/0x2718...25d3\u003c/div>\u003c/div>\n      \u003c/a>\n    \u003c/div>\n    \u003cimg src=\"landing-pages/livro/assets/book-cover-mockup.png\" alt=\"Solbook - Smartcontract Engineer\" class=\"book-cover\">\n  \u003c/div>\n  \u003cdiv class=\"cta-box\">\n    \u003ch3>Solbook — Smartcontract Engineer\u003c/h3>\n    \u003cp>Auditorias são necessárias mas não suficientes — aprenda defesa em profundidade\u003c/p>\n  \u003c/div>\n  \u003cdiv class=\"branding\">\u003cspan>Solbook · \u003cspan class=\"author-name\">Lucas Oliveira\u003c/span>\u003c/span>\u003cspan>linkedin.com/in/olivmath\u003c/span>\u003c/div>\n"]}</script><script src="carousel/dist/app.js"></script></body></html>
