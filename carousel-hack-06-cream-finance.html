<!doctype html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Cream Finance — Security Incident</title><link rel="stylesheet" href="carousel/dist/app.css"></head><body><div id="root"></div><script>window.CAROUSEL_DATA={"slug":"cream-finance","name":"Cream Finance","report":"REPORT 06","slides":["\n  \u003cspan class=\"slide-num\">01 / 05\u003c/span>\u003cspan class=\"slide-label\">Report #06\u003c/span>\n  \u003cdiv class=\"date-badge\">27 Out 2021\u003c/div>\n  \u003cdiv class=\"value\">US$ 130M\u003c/div>\n  \u003cdiv class=\"hack-name\">Cream Finance\u003c/div>\n  \u003cdiv class=\"headline\">\"O terceiro ataque ao Cream em um ano\"\u003c/div>\n  \u003cspan class=\"severity-tag severity-critical\">FLASH LOAN + PRICE MANIPULATION · CRITICAL\u003c/span>\n  \u003cp style=\"margin-top:24px;color:rgba(255,255,255,.4);font-size:15px\">Três ataques em 2021: US$37M, US$19M e US$130M — mesma causa raiz\u003c/p>\n  \u003cdiv class=\"branding\">\u003cspan>Solbook · \u003cspan class=\"author-name\">Lucas Oliveira\u003c/span>\u003c/span>\u003cspan>linkedin.com/in/olivmath\u003c/span>\u003c/div>\n","\n  \u003cspan class=\"slide-num\">02 / 05\u003c/span>\u003cspan class=\"slide-label\">A História\u003c/span>\n  \u003cdiv class=\"section-title\">O que aconteceu\u003c/div>\n  \u003cdiv class=\"story-text\">\n    \u003cstrong>Cream Finance\u003c/strong> era um protocolo de lending (empréstimos) fork do Compound. Já tinha sofrido \u003cem>dois ataques\u003c/em> no mesmo ano.\n    \u003cbr>\u003cbr>\n    No terceiro ataque, o mais devastador, o atacante usou \u003cem>flash loans\u003c/em> para inflar artificialmente o preço de um token colateral (crYUSD).\n    \u003cbr>\u003cbr>\n    O problema central: o \u003cstrong>exchange rate\u003c/strong> do crYUSD era calculado dentro de um único bloco, sem proteção contra \u003cem>manipulação atômica\u003c/em>.\n    \u003cbr>\u003cbr>\n    O atacante inflou o valor do colateral via flash loan, tomou empréstimos massivos usando esse colateral \"inflado\", e \u003cstrong>saiu com US$130M\u003c/strong> sem devolver nada.\n  \u003c/div>\n  \u003cdiv class=\"branding\">\u003cspan>Solbook · \u003cspan class=\"author-name\">Lucas Oliveira\u003c/span>\u003c/span>\u003cspan>linkedin.com/in/olivmath\u003c/span>\u003c/div>\n","\n  \u003cspan class=\"slide-num\">03 / 05\u003c/span>\u003cspan class=\"slide-label\">O Código\u003c/span>\n  \u003cdiv class=\"section-title\">Contrato Vulnerável\u003c/div>\n  \u003cdiv class=\"vuln-label\">⚠️ LINHA VULNERÁVEL\u003c/div>\n  \u003ccode class=\"code-block\">\u003cspan class=\"kw\">function\u003c/span> \u003cspan class=\"fn\">exchangeRateCurrent\u003c/span>()\n    \u003cspan class=\"kw\">public\u003c/span> \u003cspan class=\"kw\">view\u003c/span> \u003cspan class=\"kw\">returns\u003c/span> (\u003cspan class=\"tp\">uint256\u003c/span>)\n{\n    \u003cspan class=\"tp\">uint\u003c/span> totalCash \u003cspan class=\"op\">=\u003c/span> \u003cspan class=\"fn\">getCash\u003c/span>();\n    \u003cspan class=\"tp\">uint\u003c/span> totalBorrows \u003cspan class=\"op\">=\u003c/span> \u003cspan class=\"fn\">totalBorrowsCurrent\u003c/span>();\n    \u003cspan class=\"tp\">uint\u003c/span> totalReserves \u003cspan class=\"op\">=\u003c/span> totalReservesStored;\n\n    \u003cspan class=\"cmt\">// Manipulável em single block!\u003c/span>\n\u003cspan class=\"vuln-line\">    \u003cspan class=\"kw\">return\u003c/span> (totalCash \u003cspan class=\"op\">+\u003c/span> totalBorrows\u003c/span>\n\u003cspan class=\"vuln-line\">            \u003cspan class=\"op\">-\u003c/span> totalReserves)\u003c/span>\n\u003cspan class=\"vuln-line\">           \u003cspan class=\"op\">*\u003c/span> \u003cspan class=\"num\">1e18\u003c/span> \u003cspan class=\"op\">/\u003c/span> totalSupply;\u003c/span>\n\n    \u003cspan class=\"cmt\">// Flash loan infla totalCash →\u003c/span>\n    \u003cspan class=\"cmt\">// exchangeRate dispara →\u003c/span>\n    \u003cspan class=\"cmt\">// colateral vale mais do que deveria\u003c/span>\n}\n  \u003c/code>\n  \u003cdiv class=\"lesson-box\">\n    \u003cdiv class=\"lesson-label\">Lição\u003c/div>\n    \u003cp>Exchange rates devem ser \u003cspan class=\"lime\">resistentes a manipulação em single-block\u003c/span>. Use TWAP ou limite variação por bloco.\u003c/p>\n  \u003c/div>\n  \u003cdiv class=\"branding\">\u003cspan>Solbook · \u003cspan class=\"author-name\">Lucas Oliveira\u003c/span>\u003c/span>\u003cspan>linkedin.com/in/olivmath\u003c/span>\u003c/div>\n","\n  \u003cspan class=\"slide-num\">04 / 05\u003c/span>\u003cspan class=\"slide-label\">Análise Técnica\u003c/span>\n  \u003cdiv class=\"section-title\">Como o ataque funcionou\u003c/div>\n  \u003cdiv class=\"tech-flow\">\n    \u003cdiv class=\"step\">\u003cspan class=\"highlight\">PASSO 1\u003c/span>\u003c/div>\n    \u003cdiv class=\"step\">Flash loan massivo de DAI + USDC\u003c/div>\n    \u003cdiv class=\"step\">\u003cspan class=\"arrow\">↓\u003c/span>\u003c/div>\n    \u003cdiv class=\"step\">\u003cspan class=\"highlight\">PASSO 2\u003c/span>\u003c/div>\n    \u003cdiv class=\"step\">Deposita no Cream → recebe crYUSD\u003c/div>\n    \u003cdiv class=\"step\">\u003cspan class=\"arrow\">↓\u003c/span>\u003c/div>\n    \u003cdiv class=\"step\">\u003cspan class=\"highlight\">PASSO 3\u003c/span>\u003c/div>\n    \u003cdiv class=\"step\">Deposita mais → \u003cspan class=\"danger\">totalCash dispara\u003c/span>\u003c/div>\n    \u003cdiv class=\"step\">\u003cspan class=\"arrow\">↓\u003c/span>\u003c/div>\n    \u003cdiv class=\"step\">\u003cspan class=\"highlight\">PASSO 4\u003c/span>\u003c/div>\n    \u003cdiv class=\"step\">exchangeRate inflado → \u003cspan class=\"danger\">crYUSD vale 10x+\u003c/span>\u003c/div>\n    \u003cdiv class=\"step\">\u003cspan class=\"arrow\">↓\u003c/span>\u003c/div>\n    \u003cdiv class=\"step\">\u003cspan class=\"highlight\">PASSO 5\u003c/span>\u003c/div>\n    \u003cdiv class=\"step\">Usa crYUSD inflado como colateral\u003c/div>\n    \u003cdiv class=\"step\">Pega empréstimos em ETH, WBTC, USDC...\u003c/div>\n    \u003cdiv class=\"step\">\u003cspan class=\"arrow\">↓\u003c/span>\u003c/div>\n    \u003cdiv class=\"step\">\u003cspan class=\"highlight\">PASSO 6\u003c/span>\u003c/div>\n    \u003cdiv class=\"step\">\u003cspan class=\"danger\">Sai com US$130M · Não devolve nada\u003c/span>\u003c/div>\n  \u003c/div>\n  \u003cdiv class=\"branding\">\u003cspan>Solbook · \u003cspan class=\"author-name\">Lucas Oliveira\u003c/span>\u003c/span>\u003cspan>linkedin.com/in/olivmath\u003c/span>\u003c/div>\n","\n  \u003cspan class=\"slide-num\">05 / 05\u003c/span>\u003cspan class=\"slide-label\">On-Chain\u003c/span>\n  \u003cdiv class=\"section-title\">Verifique na Blockchain\u003c/div>\n  \u003cdiv style=\"display:flex;gap:32px;align-items:flex-start\">\n    \u003cdiv style=\"flex:1\">\n      \u003ca class=\"link-card\" href=\"https://etherscan.io/tx/0x0fe2542079644e107cbf13690eb9c2c65963ccb79089ff96bfaf8dced2331c92\" target=\"_blank\">\n        \u003cdiv>\u003cdiv class=\"label\">Transação do Ataque\u003c/div>\u003cdiv class=\"url\">etherscan.io/tx/0x0fe254...31c92\u003c/div>\u003c/div>\n      \u003c/a>\n      \u003ca class=\"link-card\" href=\"https://etherscan.io/address/0x44fbeBd2F576670a6C33f6Fc0B00aA8c5753b322\" target=\"_blank\">\n        \u003cdiv>\u003cdiv class=\"label\">Contrato Cream\u003c/div>\u003cdiv class=\"url\">etherscan.io/address/0x44fbe...b322\u003c/div>\u003c/div>\n      \u003c/a>\n    \u003c/div>\n    \u003cimg src=\"landing-pages/livro/assets/book-cover-mockup.png\" alt=\"Solbook - Smartcontract Engineer\" class=\"book-cover\">\n  \u003c/div>\n  \u003cdiv class=\"cta-box\">\n    \u003ch3>Solbook — Smartcontract Engineer\u003c/h3>\n    \u003cp>Entenda como flash loans exploram exchange rates manipuláveis\u003c/p>\n  \u003c/div>\n  \u003cdiv class=\"branding\">\u003cspan>Solbook · \u003cspan class=\"author-name\">Lucas Oliveira\u003c/span>\u003c/span>\u003csp
