<!doctype html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>bZx — Security Incident</title><link rel="stylesheet" href="carousel/dist/app.css"></head><body><div id="root"></div><script>window.CAROUSEL_DATA={"slug":"bzx","name":"bZx","report":"REPORT 04","slides":["\n  \u003cspan class=\"slide-num\">01 / 05\u003c/span>\u003cspan class=\"slide-label\">Report #04\u003c/span>\n  \u003cdiv class=\"date-badge\">15 Fev 2020\u003c/div>\n  \u003cdiv class=\"value\">US$ 8M\u003c/div>\n  \u003cdiv class=\"hack-name\">bZx Protocol\u003c/div>\n  \u003cdiv class=\"headline\">\"O primeiro flash loan attack da história\"\u003c/div>\n  \u003cspan class=\"severity-tag severity-critical\">FLASH LOAN + ORACLE · CRITICAL\u003c/span>\n  \u003cp style=\"margin-top:24px;color:rgba(255,255,255,.4);font-size:15px\">Dois ataques em 4 dias explorando oráculos on-chain manipuláveis\u003c/p>\n  \u003cdiv class=\"branding\">\u003cspan>Solbook · \u003cspan class=\"author-name\">Lucas Oliveira\u003c/span>\u003c/span>\u003cspan>linkedin.com/in/olivmath\u003c/span>\u003c/div>\n","\n  \u003cspan class=\"slide-num\">02 / 05\u003c/span>\u003cspan class=\"slide-label\">A História\u003c/span>\n  \u003cdiv class=\"section-title\">O que aconteceu\u003c/div>\n  \u003cdiv class=\"story-text\">\n    \u003cstrong>bZx\u003c/strong> era um protocolo de margin trading descentralizado. Usava \u003cem>oráculos on-chain\u003c/em> (Kyber/Uniswap) para obter preços de ativos.\n    \u003cbr>\u003cbr>\n    O atacante fez um \u003cem>flash loan\u003c/em> de 10.000 ETH no dYdX — empréstimo sem colateral que precisa ser devolvido na mesma transação.\n    \u003cbr>\u003cbr>\n    Com esse capital, \u003cstrong>manipulou o preço\u003c/strong> em uma pool de baixa liquidez e fez margin trading no bZx usando o preço inflado.\n    \u003cbr>\u003cbr>\n    O bZx liquidou a posição com o \u003cstrong>preço real\u003c/strong>, mas o atacante já tinha lucrado a diferença. Tudo em \u003cem>uma única transação atômica\u003c/em>.\n  \u003c/div>\n  \u003cdiv class=\"branding\">\u003cspan>Solbook · \u003cspan class=\"author-name\">Lucas Oliveira\u003c/span>\u003c/span>\u003cspan>linkedin.com/in/olivmath\u003c/span>\u003c/div>\n","\n  \u003cspan class=\"slide-num\">03 / 05\u003c/span>\u003cspan class=\"slide-label\">O Código\u003c/span>\n  \u003cdiv class=\"section-title\">Contrato Vulnerável\u003c/div>\n  \u003cdiv class=\"vuln-label\">⚠️ LINHA VULNERÁVEL\u003c/div>\n  \u003ccode class=\"code-block\">\u003cspan class=\"cmt\">// Oráculo de preço do bZx\u003c/span>\n\u003cspan class=\"kw\">function\u003c/span> \u003cspan class=\"fn\">getExpectedRate\u003c/span>(\n    \u003cspan class=\"tp\">address\u003c/span> src,\n    \u003cspan class=\"tp\">address\u003c/span> dest,\n    \u003cspan class=\"tp\">uint\u003c/span> srcQty\n) \u003cspan class=\"kw\">external\u003c/span> \u003cspan class=\"kw\">view\u003c/span> \u003cspan class=\"kw\">returns\u003c/span> (\u003cspan class=\"tp\">uint256\u003c/span>) {\n\n    \u003cspan class=\"cmt\">// Consulta preço spot de uma pool\u003c/span>\n\u003cspan class=\"vuln-line\">    \u003cspan class=\"kw\">return\u003c/span> kyberProxy.\u003cspan class=\"fn\">getExpectedRate\u003c/span>(\u003c/span>\n\u003cspan class=\"vuln-line\">        src, dest, srcQty\u003c/span>\n\u003cspan class=\"vuln-line\">    );\u003c/span>\n\n    \u003cspan class=\"cmt\">// Preço manipulável com flash loan!\u003c/span>\n    \u003cspan class=\"cmt\">// Sem TWAP, sem múltiplas fontes\u003c/span>\n}\n  \u003c/code>\n  \u003cdiv class=\"lesson-box\">\n    \u003cdiv class=\"lesson-label\">Lição\u003c/div>\n    \u003cp>Use oráculos \u003cspan class=\"lime\">descentralizados (Chainlink)\u003c/span> com \u003cspan class=\"lime\">TWAP\u003c/span> — nunca preço spot de uma pool única.\u003c/p>\n  \u003c/div>\n  \u003cdiv class=\"branding\">\u003cspan>Solbook · \u003cspan class=\"author-name\">Lucas Oliveira\u003c/span>\u003c/span>\u003cspan>linkedin.com/in/olivmath\u003c/span>\u003c/div>\n","\n  \u003cspan class=\"slide-num\">04 / 05\u003c/span>\u003cspan class=\"slide-label\">Análise Técnica\u003c/span>\n  \u003cdiv class=\"section-title\">Como o ataque funcionou\u003c/div>\n  \u003cdiv class=\"tech-flow\">\n    \u003cdiv class=\"step\">\u003cspan class=\"highlight\">PASSO 1\u003c/span>\u003c/div>\n    \u003cdiv class=\"step\">Flash loan: pega 10.000 ETH emprestado (dYdX)\u003c/div>\n    \u003cdiv class=\"step\">\u003cspan class=\"arrow\">↓\u003c/span>\u003c/div>\n    \u003cdiv class=\"step\">\u003cspan class=\"highlight\">PASSO 2\u003c/span>\u003c/div>\n    \u003cdiv class=\"step\">Deposita 5.000 ETH como colateral no Compound\u003c/div>\n    \u003cdiv class=\"step\">\u003cspan class=\"arrow\">↓\u003c/span>\u003c/div>\n    \u003cdiv class=\"step\">\u003cspan class=\"highlight\">PASSO 3\u003c/span>\u003c/div>\n    \u003cdiv class=\"step\">Swap 5.000 ETH em pool rasa → \u003cspan class=\"danger\">preço dispara\u003c/span>\u003c/div>\n    \u003cdiv class=\"step\">\u003cspan class=\"arrow\">↓\u003c/span>\u003c/div>\n    \u003cdiv class=\"step\">\u003cspan class=\"highlight\">PASSO 4\u003c/span>\u003c/div>\n    \u003cdiv class=\"step\">bZx consulta oráculo → \u003cspan class=\"danger\">lê preço inflado\u003c/span>\u003c/div>\n    \u003cdiv class=\"step\">\u003cspan class=\"arrow\">↓\u003c/span>\u003c/div>\n    \u003cdiv class=\"step\">\u003cspan class=\"highlight\">PASSO 5\u003c/span>\u003c/div>\n    \u003cdiv class=\"step\">Margin trade no bZx com preço manipulado\u003c/div>\n    \u003cdiv class=\"step\">\u003cspan class=\"arrow\">↓\u003c/span>\u003c/div>\n    \u003cdiv class=\"step\">\u003cspan class=\"highlight\">PASSO 6\u003c/span>\u003c/div>\n    \u003cdiv class=\"step\">Devolve flash loan + fica com \u003cspan class=\"lime\">US$8M de lucro\u003c/span>\u003c/div>\n    \u003cdiv class=\"step\" style=\"margin-top:16px;color:rgba(255,255,255,.4)\">Tudo em UMA transação · ~15 segundos\u003c/
