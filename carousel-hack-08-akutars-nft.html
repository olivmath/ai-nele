<!doctype html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Akutars — Security Incident</title><link rel="stylesheet" href="carousel/dist/app.css"></head><body><div id="root"></div><script>window.CAROUSEL_DATA={"slug":"akutars-nft","name":"Akutars","report":"REPORT 08","slides":["\n  \u003cspan class=\"slide-num\">01 / 05\u003c/span>\u003cspan class=\"slide-label\">Report #08\u003c/span>\n  \u003cdiv class=\"date-badge\">22 Abr 2022\u003c/div>\n  \u003cdiv class=\"value\">11.539 ETH\u003c/div>\n  \u003cdiv class=\"hack-name\">Akutars NFT\u003c/div>\n  \u003cdiv class=\"headline\">\"11.539 ETH presos para sempre por uma linha\"\u003c/div>\n  \u003cspan class=\"severity-tag severity-critical\">STATE VARIABLE BUG · CRITICAL\u003c/span>\n  \u003cp style=\"margin-top:24px;color:rgba(255,255,255,.4);font-size:15px\">~US$34M travados permanentemente — sem hack externo, apenas um bug\u003c/p>\n  \u003cdiv class=\"branding\">\u003cspan>Solbook · \u003cspan class=\"author-name\">Lucas Oliveira\u003c/span>\u003c/span>\u003cspan>linkedin.com/in/olivmath\u003c/span>\u003c/div>\n","\n  \u003cspan class=\"slide-num\">02 / 05\u003c/span>\u003cspan class=\"slide-label\">A História\u003c/span>\n  \u003cdiv class=\"section-title\">O que aconteceu\u003c/div>\n  \u003cdiv class=\"story-text\">\n    \u003cstrong>Akutars\u003c/strong> era uma coleção NFT de 15.000 peças do artista \u003cem>Micah Johnson\u003c/em>, com leilão holandês que arrecadou \u003cem>11.539 ETH\u003c/em>.\n    \u003cbr>\u003cbr>\n    Após o leilão, o contrato deveria \u003cstrong>reembolsar\u003c/strong> quem pagou acima do preço final. A lógica de refund usava um loop com uma variável de estado.\n    \u003cbr>\u003cbr>\n    O bug: \u003cem>refundProgress\u003c/em> era atualizado \u003cstrong>antes\u003c/strong> de um \u003cem>require\u003c/em> que dependia do valor anterior. O invariante quebrava, e o require sempre falhava.\n    \u003cbr>\u003cbr>\n    Ninguém conseguiu ser reembolsado. E como a função de saque do owner também dependia do refund estar completo, \u003cstrong>todo o ETH ficou preso para sempre\u003c/strong> — sem nenhum atacante envolvido.\n  \u003c/div>\n  \u003cdiv class=\"branding\">\u003cspan>Solbook · \u003cspan class=\"author-name\">Lucas Oliveira\u003c/span>\u003c/span>\u003cspan>linkedin.com/in/olivmath\u003c/span>\u003c/div>\n","\n  \u003cspan class=\"slide-num\">03 / 05\u003c/span>\u003cspan class=\"slide-label\">O Código\u003c/span>\n  \u003cdiv class=\"section-title\">Contrato Vulnerável\u003c/div>\n  \u003cdiv class=\"vuln-label\">⚠️ LINHA VULNERÁVEL\u003c/div>\n  \u003ccode class=\"code-block\">\u003cspan class=\"kw\">function\u003c/span> \u003cspan class=\"fn\">processRefunds\u003c/span>() \u003cspan class=\"kw\">external\u003c/span> {\n    \u003cspan class=\"tp\">uint256\u003c/span> _refundProgress \u003cspan class=\"op\">=\u003c/span> refundProgress;\n    \u003cspan class=\"tp\">uint256\u003c/span> _totalBids \u003cspan class=\"op\">=\u003c/span> totalBids;\n\n    \u003cspan class=\"kw\">for\u003c/span> (\u003cspan class=\"tp\">uint256\u003c/span> i \u003cspan class=\"op\">=\u003c/span> _refundProgress;\n         i \u003cspan class=\"op\">&lt;\u003c/span> refundAddresses.length;\n         i\u003cspan class=\"op\">++\u003c/span>) {\n\n        \u003cspan class=\"cmt\">// Atualiza ANTES do require!\u003c/span>\n\u003cspan class=\"vuln-line\">        refundProgress \u003cspan class=\"op\">=\u003c/span> i \u003cspan class=\"op\">+\u003c/span> \u003cspan class=\"num\">1\u003c/span>;\u003c/span>\n\n        \u003cspan class=\"cmt\">// Agora refundProgress > _totalBids\u003c/span>\n\u003cspan class=\"vuln-line\">        \u003cspan class=\"kw\">require\u003c/span>(refundProgress \u003cspan class=\"op\">&lt;\u003c/span> _totalBids,\u003c/span>\n\u003cspan class=\"vuln-line\">                \u003cspan class=\"str\">\"All refunds processed\"\u003c/span>);\u003c/span>\n\n        \u003cspan class=\"cmt\">// Nunca chega aqui\u003c/span>\n        \u003cspan class=\"kw\">payable\u003c/span>(refundAddresses[i])\n            .\u003cspan class=\"fn\">transfer\u003c/span>(refundAmounts[i]);\n    }\n}\n  \u003c/code>\n  \u003cdiv class=\"lesson-box\">\n    \u003cdiv class=\"lesson-label\">Lição\u003c/div>\n    \u003cp>Loops de estado devem \u003cspan class=\"lime\">preservar os invariantes\u003c/span> dos require seguintes. Teste edge cases com \u003cspan class=\"lime\">fuzz testing\u003c/span>.\u003c/p>\n  \u003c/div>\n  \u003cdiv class=\"branding\">\u003cspan>Solbook · \u003cspan class=\"author-name\">Lucas Oliveira\u003c/span>\u003c/span>\u003cspan>linkedin.com/in/olivmath\u003c/span>\u003c/div>\n","\n  \u003cspan class=\"slide-num\">04 / 05\u003c/span>\u003cspan class=\"slide-label\">Análise Técnica\u003c/span>\n  \u003cdiv class=\"section-title\">Como o bug funcionou\u003c/div>\n  \u003cdiv class=\"tech-flow\">\n    \u003cdiv class=\"step\">\u003cspan class=\"highlight\">ESTADO INICIAL\u003c/span>\u003c/div>\n    \u003cdiv class=\"step\">refundProgress = 0, totalBids = 3592\u003c/div>\n    \u003cdiv class=\"step\">\u003cspan class=\"arrow\">↓\u003c/span>\u003c/div>\n    \u003cdiv class=\"step\">\u003cspan class=\"highlight\">ITERAÇÃO i = 3591\u003c/span>\u003c/div>\n    \u003cdiv class=\"step\">refundProgress = 3591 + 1 = \u003cspan class=\"danger\">3592\u003c/span>\u003c/div>\n    \u003cdiv class=\"step\">\u003cspan class=\"arrow\">↓\u003c/span>\u003c/div>\n    \u003cdiv class=\"step\">\u003cspan class=\"highlight\">CHECK\u003c/span>\u003c/div>\n    \u003cdiv class=\"step\">require(3592 &lt; 3592) → \u003cspan class=\"danger\">FALSE → REVERT!\u003c/span>\u003c/div>\n    \u003cdiv class=\"step\">\u003cspan class=\"arrow\">↓\u003c/span>\u003c/div>\n    \u003cdiv class=\"step\">\u003cspan class=\"highlight\">CONSEQUÊNCIA 1\u003c/span>\u003c/div>\n    \u003cdiv class=\"step\">Último refund nunca processa\u003c/div>\n    \u003cdiv class=\"step\">\u003cspan class=\"arrow\">↓\u003c/span>\u003c/div>\n    \u003cdiv class=\"step\">\u003cspan class=\"highlight\">CONSEQUÊNCIA 2\u003c/span>\u003c/div>\n    \u003cdiv class=\"step\">withdraw() requer refund completo\u003c/div>\n    \u003cdiv class=\"step\">\u003cspan class=\"arrow\">↓\u003c/span>\u003c/div>\n    \u003cdiv class=\"step\">\u003cspan class=\"highlight\">RESULTADO\u003c/span>\u003c/div>\n    \u003cdiv class=\"step\">\u003cspan class=\"danger\">11.539 ETH trancados PERMANENTEMENTE\u003c/span>\u003c/div>\n    \u003cdiv class=\"step\">\u003cspan class=\"danger\">Contrato imutável · Sem escape hatch\u003c/span>\u003c/div>\n  \u003c/div>\n  \u003cdiv class=\"branding\">\u003cspan>Solbook · \u003cspan class=\"author-name\">Lucas Oliveira\u003c/span>\u003c/span>\u003cspan>linkedin.com/in/olivmath\u003c/span>\u003c/div>\n","\n  \u003cspan class=\"slide-num\">05 / 05\u003c/span>\u003cspan class=\"slide-label\">On-Chain\u003c/span>\n  \u003cdiv class=\"section-title\">Verifique na Blockchain\u003c/div>\n  \u003cdiv style=\"display:flex;gap:32px;align-items:flex-start\">\n    \u003cdiv style=\"flex:1\">\n      \u003ca class=\"link-card\" href=\"https://etherscan.io/tx/0x583a5aeabb9e2da0b9f3d0bcda74b2fda961d48e2dfa43ef3571e59a4a973547\" target=\"_blank\">\n        \u003cdiv>\u003cdiv class=\"label\">Transação com revert\u003c/div>\u003cdiv class=\"url\">etherscan.io/tx/0x583a5a...3547\u003c/div>\u003c/div>\n      \u003c/a>\n      \u003ca class=\"link-card\" href=\"https://etherscan.io/address/0xF42c318dbfBaab0EEE040279C6a2588Fa01a961d\" target=\"_blank\">\n        \u003cdiv>\u003cdiv class=\"label\">Contrato Akutars\u003c/div>\u003cdiv class=\"url\">etherscan.io/address/0xF42c3...961d\u003c/div>\u003c/div>\n      \u003c/a>\n    \u003c/div>\n    \u003cimg src=\"landing-pages/livro/assets/book-cover-mockup.png\" alt=\"Solbook - Smartcontract Engineer\" class=\"book-cover\">\n  \u003c/div>\n  \u003cdiv class=\"cta-box\">\n    \u003ch3>Solbook — Smartcontract Engineer\u003c/h3>\n    \u003cp>Aprenda fuzz testing com Foundry para pegar bugs antes do deploy\u003c/p>\n  \u003c/div>\n  \u003cdiv class=\"branding\">\u003cspan>Solbook · \u003cspan class=\"author-name\">Lucas Oliveira\u003c/span>\u003c/span>\u003cspan>linkedin.com/in/olivmath\u003c/span>\u003c/div>\n"]}</script><script src="carousel/dist/app.js"></script></body></html>
