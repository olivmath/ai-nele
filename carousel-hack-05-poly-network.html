<!doctype html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Poly Network — Security Incident</title><link rel="stylesheet" href="carousel/dist/app.css"></head><body><div id="root"></div><script>window.CAROUSEL_DATA={"slug":"poly-network","name":"Poly Network","report":"REPORT 05","slides":["\n  \u003cspan class=\"slide-num\">01 / 05\u003c/span>\u003cspan class=\"slide-label\">Report #05\u003c/span>\n  \u003cdiv class=\"date-badge\">10 Ago 2021\u003c/div>\n  \u003cdiv class=\"value\">US$ 611M\u003c/div>\n  \u003cdiv class=\"hack-name\">Poly Network\u003c/div>\n  \u003cdiv class=\"headline\">\"US$611M roubados — e devolvidos\"\u003c/div>\n  \u003cspan class=\"severity-tag severity-critical\">CROSS-CHAIN · CRITICAL\u003c/span>\n  \u003cp style=\"margin-top:24px;color:rgba(255,255,255,.4);font-size:15px\">O maior hack de DeFi até então — atacante devolveu tudo e recebeu oferta de emprego\u003c/p>\n  \u003cdiv class=\"branding\">\u003cspan>Solbook · \u003cspan class=\"author-name\">Lucas Oliveira\u003c/span>\u003c/span>\u003cspan>linkedin.com/in/olivmath\u003c/span>\u003c/div>\n","\n  \u003cspan class=\"slide-num\">02 / 05\u003c/span>\u003cspan class=\"slide-label\">A História\u003c/span>\n  \u003cdiv class=\"section-title\">O que aconteceu\u003c/div>\n  \u003cdiv class=\"story-text\">\n    \u003cstrong>Poly Network\u003c/strong> era uma bridge cross-chain que conectava Ethereum, BSC e Polygon, permitindo transferir ativos entre blockchains.\n    \u003cbr>\u003cbr>\n    O atacante descobriu que podia \u003cem>crafar uma mensagem cross-chain\u003c/em> que chamava a função interna de troca de \u003cem>keeper\u003c/em> (administrador).\n    \u003cbr>\u003cbr>\n    A função \u003cstrong>_executeCrossChainTx\u003c/strong> fazia um \u003cem>call arbitrário\u003c/em> sem validar adequadamente o destino. O atacante \u003cstrong>trocou o keeper para si mesmo\u003c/strong>.\n    \u003cbr>\u003cbr>\n    Com controle total, drenou \u003cem>US$611M\u003c/em> em múltiplas chains. Dias depois, devolveu tudo — alegando que \"queria expor a vulnerabilidade\". A Poly Network ofereceu-lhe um cargo de \u003cstrong>Chief Security Advisor\u003c/strong>.\n  \u003c/div>\n  \u003cdiv class=\"branding\">\u003cspan>Solbook · \u003cspan class=\"author-name\">Lucas Oliveira\u003c/span>\u003c/span>\u003cspan>linkedin.com/in/olivmath\u003c/span>\u003c/div>\n","\n  \u003cspan class=\"slide-num\">03 / 05\u003c/span>\u003cspan class=\"slide-label\">O Código\u003c/span>\n  \u003cdiv class=\"section-title\">Contrato Vulnerável\u003c/div>\n  \u003cdiv class=\"vuln-label\">⚠️ LINHA VULNERÁVEL\u003c/div>\n  \u003ccode class=\"code-block\">\u003cspan class=\"kw\">function\u003c/span> \u003cspan class=\"fn\">_executeCrossChainTx\u003c/span>(\n    \u003cspan class=\"tp\">address\u003c/span> _toContract,\n    \u003cspan class=\"tp\">bytes\u003c/span> \u003cspan class=\"kw\">memory\u003c/span> _method,\n    \u003cspan class=\"tp\">bytes\u003c/span> \u003cspan class=\"kw\">memory\u003c/span> _args,\n    \u003cspan class=\"tp\">bytes\u003c/span> \u003cspan class=\"kw\">memory\u003c/span> _fromContractAddr,\n    \u003cspan class=\"tp\">uint64\u003c/span> _fromChainId\n) \u003cspan class=\"kw\">internal\u003c/span> \u003cspan class=\"kw\">returns\u003c/span> (\u003cspan class=\"tp\">bool\u003c/span>) {\n\n    \u003cspan class=\"cmt\">// Call arbitrário sem validação!\u003c/span>\n\u003cspan class=\"vuln-line\">    (\u003cspan class=\"tp\">bool\u003c/span> success, ) \u003cspan class=\"op\">=\u003c/span> _toContract.\u003cspan class=\"fn\">call\u003c/span>(\u003c/span>\n\u003cspan class=\"vuln-line\">        \u003cspan class=\"fn\">abi.encodePacked\u003c/span>(\u003c/span>\n\u003cspan class=\"vuln-line\">            \u003cspan class=\"tp\">bytes4\u003c/span>(\u003cspan class=\"fn\">keccak256\u003c/span>(_method)),\u003c/span>\n\u003cspan class=\"vuln-line\">            _args\u003c/span>\n\u003cspan class=\"vuln-line\">        )\u003c/span>\n\u003cspan class=\"vuln-line\">    );\u003c/span>\n}\n  \u003c/code>\n  \u003cdiv class=\"lesson-box\">\n    \u003cdiv class=\"lesson-label\">Lição\u003c/div>\n    \u003cp>Valide chamadas cross-chain com \u003cspan class=\"lime\">whitelists de funções\u003c/span> — nunca permita calls arbitrários em contratos críticos.\u003c/p>\n  \u003c/div>\n  \u003cdiv class=\"branding\">\u003cspan>Solbook · \u003cspan class=\"author-name\">Lucas Oliveira\u003c/span>\u003c/span>\u003cspan>linkedin.com/in/olivmath\u003c/span>\u003c/div>\n","\n  \u003cspan class=\"slide-num\">04 / 05\u003c/span>\u003cspan class=\"slide-label\">Análise Técnica\u003c/span>\n  \u003cdiv class=\"section-title\">Como o ataque funcionou\u003c/div>\n  \u003cdiv class=\"tech-flow\">\n    \u003cdiv class=\"step\">\u003cspan class=\"highlight\">PASSO 1\u003c/span>\u003c/div>\n    \u003cdiv class=\"step\">Atacante cria mensagem cross-chain maliciosa\u003c/div>\n    \u003cdiv class=\"step\">\u003cspan class=\"arrow\">↓\u003c/span>\u003c/div>\n    \u003cdiv class=\"step\">\u003cspan class=\"highlight\">PASSO 2\u003c/span>\u003c/div>\n    \u003cdiv class=\"step\">Mensagem chama _executeCrossChainTx\u003c/div>\n    \u003cdiv class=\"step\">\u003cspan class=\"arrow\">↓\u003c/span>\u003c/div>\n    \u003cdiv class=\"step\">\u003cspan class=\"highlight\">PASSO 3\u003c/span>\u003c/div>\n    \u003cdiv class=\"step\">_method = \u003cspan class=\"danger\">\"putCurEpochConPubKeyBytes\"\u003c/span>\u003c/div>\n    \u003cdiv class=\"step\">(função que troca o keeper/admin)\u003c/div>\n    \u003cdiv class=\"step\">\u003cspan class=\"arrow\">↓\u003c/span>\u003c/div>\n    \u003cdiv class=\"step\">\u003cspan class=\"highlight\">PASSO 4\u003c/span>\u003c/div>\n    \u003cdiv class=\"step\">_toContract.call() → \u003cspan class=\"danger\">troca keeper para o atacante\u003c/span>\u003c/div>\n    \u003cdiv class=\"step\">\u003cspan class=\"arrow\">↓\u003c/span>\u003c/div>\n    \u003cdiv class=\"step\">\u003cspan class=\"highlight\">PASSO 5\u003c/span>\u003c/div>\n    \u003cdiv class=\"step\">Atacante agora é admin de 3 bridges\u003c/div>\n    \u003cdiv class=\"step\">\u003cspan class=\"arrow\">↓\u003c/span>\u003c/div>\n    \u003cdiv class=\"step\">\u003cspan class=\"highlight\">RESULTADO\u003c/span>\u003c/div>\n    \u003cdiv class=\"step\">\u003cspan class=\"danger\">Drena US$611M em ETH, BSC e Polygon\u003c/span>\u003c/div>\n    \u003cdiv class=\"step\" style=\"margin-top:12px\">\u003cspan class=\"lime\">Devolveu tudo dias depois\u003c/span>\u003c/div>\n  \u003c/div>\n  \u003cdiv class=\"branding\">\u003cspan>Solbook · \u003cspan class=\"author-name\">Lucas Oliveira\u003c/span>\u003c/span>\u003cspan>linkedin.com/in/olivmath\u003c/span>\u003c/div>\n","\n  \u003cspan class=\"slide-num\">05 / 05\u003c/span>\u003cspan class=\"slide-label\">On-Chain\u003c/span>\n  \u003cdiv class=\"section-title\">Verifique na Blockchain\u003c/div>\n  \u003cdiv style=\"display:flex;gap:32px;align-items:flex-start\">\n    \u003cdiv style=\"flex:1\">\n      \u003ca class=\"link-card\" href=\"https://etherscan.io/tx/0xad7a2c70c958fcd3effbf374d0acf3774a9257577625ae4c838e24b0de17602a\" target=\"_blank\">\n        \u003cdiv>\u003cdiv class=\"label\">Transação do Ataque (ETH)\u003c/div>\u003cdiv class=\"url\">etherscan.io/tx/0xad7a2c...602a\u003c/div>\u003c/div>\n      \u003c/a>\n      \u003ca class=\"link-card\" href=\"https://etherscan.io/address/0xC8a65Fadf0e0dDAf421F28FEAb69Bf6E2E589963\" target=\"_blank\">\n        \u003cdiv>\u003cdiv class=\"label\">Endereço do Atacante\u003c/div>\u003cdiv class=\"url\">etherscan.io/address/0xC8a65...9963\u003c/div>\u003c/div>\n      \u003c/a>\n    \u003c/div>\n    \u003cimg src=\"landing-pages/livro/assets/book-cover-mockup.png\" alt=\"Solbook - Smartcontract Engineer\" class=\"book-cover\">\n  \u003c/div>\n  \u003cdiv class=\"cta-box\">\n    \u003ch3>Solbook — Smartcontract Engineer\u003c/h3>\n    \u003cp>Entenda por que bridges cross-chain são o elo mais fraco do ecossistema\u003c/p>\n  \u003c/div>\n  \u003cdiv class=\"branding\">\u003cspan>Solbook · \u003cspan class=\"author-name\">Lucas Oliveira\u003c/span>\u003c/span>\u003cspan>linkedin.com/in/olivmath\u003c/span>\u003c/div>\n"]}</script><script src="carousel/dist/app.js"></script></body></html>
