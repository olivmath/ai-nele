<!doctype html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>BeautyChain — Security Incident</title><link rel="stylesheet" href="carousel/dist/app.css"></head><body><div id="root"></div><script>window.CAROUSEL_DATA={"slug":"beautychain","name":"BeautyChain","report":"REPORT 03","slides":["\n  \u003cspan class=\"slide-num\">01 / 05\u003c/span>\u003cspan class=\"slide-label\">Report #03\u003c/span>\n  \u003cdiv class=\"date-badge\">22 Abr 2018\u003c/div>\n  \u003cdiv class=\"value\">US$ 900M+\u003c/div>\n  \u003cdiv class=\"hack-name\">BeautyChain\u003c/div>\n  \u003cdiv class=\"headline\">\"Uma multiplicação criou tokens infinitos\"\u003c/div>\n  \u003cspan class=\"severity-tag severity-critical\">INTEGER OVERFLOW · CRITICAL\u003c/span>\n  \u003cp style=\"margin-top:24px;color:rgba(255,255,255,.4);font-size:15px\">Market cap de US$ 2,3 bilhões destruído por uma operação aritmética\u003c/p>\n  \u003cdiv class=\"branding\">\u003cspan>Solbook · \u003cspan class=\"author-name\">Lucas Oliveira\u003c/span>\u003c/span>\u003cspan>linkedin.com/in/olivmath\u003c/span>\u003c/div>\n","\n  \u003cspan class=\"slide-num\">02 / 05\u003c/span>\u003cspan class=\"slide-label\">A História\u003c/span>\n  \u003cdiv class=\"section-title\">O que aconteceu\u003c/div>\n  \u003cdiv class=\"story-text\">\n    \u003cstrong>BeautyChain (BEC)\u003c/strong> era um token ERC-20 listado em exchanges como a OKEx, com market cap acima de \u003cem>US$ 2,3 bilhões\u003c/em>.\n    \u003cbr>\u003cbr>\n    O contrato tinha uma função \u003cem>batchTransfer\u003c/em> — ideia boa: enviar tokens para várias pessoas em uma transação, economizando gas.\n    \u003cbr>\u003cbr>\n    O problema: a multiplicação \u003cstrong>receivers.length × value\u003c/strong> podia estourar o limite do \u003cem>uint256\u003c/em>. Com \u003cem>value = 2²⁵⁵\u003c/em> e \u003cem>2 receivers\u003c/em>, o resultado era \u003cstrong>zero\u003c/strong>.\n    \u003cbr>\u003cbr>\n    O atacante passou na verificação de saldo (saldo >= 0) e \u003cstrong>criou tokens do nada\u003c/strong>. A oferta explodiu e o preço colapsou.\n  \u003c/div>\n  \u003cdiv class=\"branding\">\u003cspan>Solbook · \u003cspan class=\"author-name\">Lucas Oliveira\u003c/span>\u003c/span>\u003cspan>linkedin.com/in/olivmath\u003c/span>\u003c/div>\n","\n  \u003cspan class=\"slide-num\">03 / 05\u003c/span>\u003cspan class=\"slide-label\">O Código\u003c/span>\n  \u003cdiv class=\"section-title\">Contrato Vulnerável\u003c/div>\n  \u003cdiv class=\"vuln-label\">⚠️ LINHA VULNERÁVEL\u003c/div>\n  \u003ccode class=\"code-block\">\u003cspan class=\"kw\">function\u003c/span> \u003cspan class=\"fn\">batchTransfer\u003c/span>(\n    \u003cspan class=\"tp\">address\u003c/span>[] _receivers,\n    \u003cspan class=\"tp\">uint256\u003c/span> _value\n) \u003cspan class=\"kw\">public\u003c/span> \u003cspan class=\"kw\">returns\u003c/span> (\u003cspan class=\"tp\">bool\u003c/span>) {\n    \u003cspan class=\"tp\">uint\u003c/span> cnt \u003cspan class=\"op\">=\u003c/span> _receivers.length;\n\n    \u003cspan class=\"cmt\">// Overflow: 2²⁵⁵ × 2 = 0\u003c/span>\n\u003cspan class=\"vuln-line\">    \u003cspan class=\"tp\">uint256\u003c/span> amount \u003cspan class=\"op\">=\u003c/span> \u003cspan class=\"tp\">uint256\u003c/span>(cnt) \u003cspan class=\"op\">*\u003c/span> _value;\u003c/span>\n\n    \u003cspan class=\"cmt\">// 0 \u003c= qualquer saldo → passa!\u003c/span>\n    \u003cspan class=\"kw\">require\u003c/span>(_balances[\u003cspan class=\"var\">msg.sender\u003c/span>] \u003cspan class=\"op\">>=\u003c/span> amount);\n\n    _balances[\u003cspan class=\"var\">msg.sender\u003c/span>] \u003cspan class=\"op\">-=\u003c/span> amount;\n    \u003cspan class=\"kw\">for\u003c/span> (\u003cspan class=\"tp\">uint\u003c/span> i \u003cspan class=\"op\">=\u003c/span> \u003cspan class=\"num\">0\u003c/span>; i \u003cspan class=\"op\">&lt;\u003c/span> cnt; i\u003cspan class=\"op\">++\u003c/span>) {\n        _balances[_receivers[i]] \u003cspan class=\"op\">+=\u003c/span> _value;\n    }\n}\n  \u003c/code>\n  \u003cdiv class=\"lesson-box\">\n    \u003cdiv class=\"lesson-label\">Lição\u003c/div>\n    \u003cp>Use \u003cspan class=\"lime\">SafeMath\u003c/span> (pre-0.8) ou \u003cspan class=\"lime\">Solidity 0.8+\u003c/span> que tem proteção automática contra overflow.\u003c/p>\n  \u003c/div>\n  \u003cdiv class=\"branding\">\u003cspan>Solbook · \u003cspan class=\"author-name\">Lucas Oliveira\u003c/span>\u003c/span>\u003cspan>linkedin.com/in/olivmath\u003c/span>\u003c/div>\n","\n  \u003cspan class=\"slide-num\">04 / 05\u003c/span>\u003cspan class=\"slide-label\">Análise Técnica\u003c/span>\n  \u003cdiv class=\"section-title\">Como o ataque funcionou\u003c/div>\n  \u003cdiv class=\"tech-flow\">\n    \u003cdiv class=\"step\">\u003cspan class=\"highlight\">PASSO 1\u003c/span>\u003c/div>\n    \u003cdiv class=\"step\">Atacante chama batchTransfer com:\u003c/div>\n    \u003cdiv class=\"step\">  receivers = [addr1, addr2] \u003cspan style=\"color:rgba(255,255,255,.4)\">(length = 2)\u003c/span>\u003c/div>\n    \u003cdiv class=\"step\">  value = 2²⁵⁵\u003c/div>\n    \u003cdiv class=\"step\">\u003cspan class=\"arrow\">↓\u003c/span>\u003c/div>\n    \u003cdiv class=\"step\">\u003cspan class=\"highlight\">PASSO 2\u003c/span>\u003c/div>\n    \u003cdiv class=\"step\">amount = 2 × 2²⁵⁵ = 2²⁵⁶\u003c/div>\n    \u003cdiv class=\"step\">\u003cspan class=\"danger\">uint256 max = 2²⁵⁶ - 1 → OVERFLOW → 0\u003c/span>\u003c/div>\n    \u003cdiv class=\"step\">\u003cspan class=\"arrow\">↓\u003c/span>\u003c/div>\n    \u003cdiv class=\"step\">\u003cspan class=\"highlight\">PASSO 3\u003c/span>\u003c/div>\n    \u003cdiv class=\"step\">require(balance >= 0) → \u003cspan class=\"lime\">sempre true\u003c/span>\u003c/div>\n    \u003cdiv class=\"step\">\u003cspan class=\"arrow\">↓\u003c/span>\u003c/div>\n    \u003cdiv class=\"step\">\u003cspan class=\"highlight\">PASSO 4\u003c/span>\u003c/div>\n    \u003cdiv class=\"step\">balances[msg.sender] -= 0 \u003cspan style=\"color:rgba(255,255,255,.4)\">(nada muda)\u003c/span>\u003c/div>\n    \u003cdiv class=\"step\">\u003cspan class=\"arrow\">↓\u003c/span>\u003c/div>\n    \u003cdiv class=\"step\">\u003cspan class=\"highlight\">PASSO 5\u003c/span>\u003c/div>\n    \u003cdiv class=\"step\">\u003cspan class=\"danger\">Cada receiver recebe 2²⁵⁵ tokens do NADA\u003c/span>\u003c/div>\n  \u003c/div>\n  \u003cdiv class=\"branding\">\u003cspan>Solbook · \u003cspan class=\"author-name\">Lucas Oliveira\u003c/span>\u003c/span>\u003cspan>linkedin.com/in/olivmath\u003c/span>\u003c/div>\n","\n  \u003cspan class=\"slide-num\">05 / 05\u003c/span>\u003cspan class=\"slide-label\">On-Chain\u003c/span>\n  \u003cdiv class=\"section-title\">Verifique na Blockchain\u003c/div>\n  \u003cdiv style=\"display:flex;gap:32px;align-items:flex-start\">\n    \u003cdiv style=\"flex:1\">\n      \u003ca class=\"link-card\" href=\"https://etherscan.io/tx/0xad89ff16fd1ebe3a0a7cf4ed282302c06626c1af33221ebe0d3a470aba4a660f\" target=\"_blank\">\n        \u003cdiv>\u003cdiv class=\"label\">Transação do Ataque\u003c/div>\u003cdiv class=\"url\">etherscan.io/tx/0xad89ff...a660f\u003c/div>\u003c/div>\n      \u003c/a>\n      \u003ca class=\"link-card\" href=\"https://etherscan.io/address/0xC5d105E63711398aF9bbff092d4B6CdeF7C9BBd9\" target=\"_blank\">\n        \u003cdiv>\u003cdiv class=\"label\">Contrato BEC Token\u003c/div>\u003cdiv class=\"url\">etherscan.io/address/0xC5d105...9BBd9\u003c/div>\u003c/div>\n      \u003c/a>\n    \u003c/div>\n    \u003cimg src=\"landing-pages/livro/assets/book-cover-mockup.png\" alt=\"Solbook - Smartcontract Engineer\" class=\"book-cover\">\n  \u003c/div>\n  \u003cdiv class=\"cta-box\">\n    \u003ch3>Solbook — Smartcontract Engineer\u003c/h3>\n    \u003cp>Domine aritmética segura e nunca escreva um overflow\u003c/p>\n  \u003c/div>\n  \u003cdiv class=\"branding\">\u003cspan>Solbook · \u003cspan class=\"author-name\">Lucas Oliveira\u003c/span>\u003c/span>\u003cspan>linkedin.com/in/olivmath\u003c/span>\u003c/div>\n"]}</script><script src="carousel/dist/app.js"></script></body></html>
