<!doctype html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Parity Wallet — Security Incident</title><link rel="stylesheet" href="carousel/dist/app.css"></head><body><div id="root"></div><script>window.CAROUSEL_DATA={"slug":"parity-wallet","name":"Parity Wallet","report":"REPORT 02","slides":["\n  \u003cspan class=\"slide-num\">01 / 05\u003c/span>\n  \u003cspan class=\"slide-label\">Report #02\u003c/span>\n  \u003cdiv class=\"date-badge\">6 Nov 2017\u003c/div>\n  \u003cdiv class=\"value\">US$ 280M\u003c/div>\n  \u003cdiv class=\"hack-name\">Parity Wallet\u003c/div>\n  \u003cdiv class=\"headline\">\"Um dev 'matou' US$280M por acidente\"\u003c/div>\n  \u003cspan class=\"severity-tag severity-critical\">SELFDESTRUCT · CRITICAL\u003c/span>\n  \u003cp style=\"margin-top:24px;color:rgba(255,255,255,.4);font-size:15px\">513.774 ETH congelados para sempre — sem possibilidade de recuperação\u003c/p>\n  \u003cdiv class=\"branding\">\u003cspan>Solbook · \u003cspan class=\"author-name\">Lucas Oliveira\u003c/span>\u003c/span>\u003cspan>linkedin.com/in/olivmath\u003c/span>\u003c/div>\n","\n  \u003cspan class=\"slide-num\">02 / 05\u003c/span>\n  \u003cspan class=\"slide-label\">A História\u003c/span>\n  \u003cdiv class=\"section-title\">O que aconteceu\u003c/div>\n  \u003cdiv class=\"story-text\">\n    \u003cstrong>Parity Technologies\u003c/strong> (empresa do co-fundador do Ethereum, Gavin Wood) criou uma \u003cem>wallet multisig\u003c/em> usada por centenas de projetos para guardar ETH arrecadado em ICOs.\n    \u003cbr>\u003cbr>\n    A wallet usava um padrão de \u003cstrong>library compartilhada\u003c/strong> — um contrato central com a lógica, referenciado por todas as instâncias via \u003cem>delegatecall\u003c/em>.\n    \u003cbr>\u003cbr>\n    Um usuário chamado \u003cem>\"devops199\"\u003c/em> descobriu que a library era um contrato \u003cstrong>não-inicializado\u003c/strong>. Chamou \u003cem>initWallet()\u003c/em>, virou owner, e então chamou \u003cem>kill()\u003c/em>.\n    \u003cbr>\u003cbr>\n    A library foi destruída. Todos os wallets que dependiam dela \u003cstrong>pararam de funcionar\u003c/strong> — com US$280M presos dentro, para sempre.\n  \u003c/div>\n  \u003cdiv class=\"branding\">\u003cspan>Solbook · \u003cspan class=\"author-name\">Lucas Oliveira\u003c/span>\u003c/span>\u003cspan>linkedin.com/in/olivmath\u003c/span>\u003c/div>\n","\n  \u003cspan class=\"slide-num\">03 / 05\u003c/span>\n  \u003cspan class=\"slide-label\">O Código\u003c/span>\n  \u003cdiv class=\"section-title\">Contrato Vulnerável\u003c/div>\n  \u003cdiv class=\"vuln-label\">⚠️ LINHA VULNERÁVEL\u003c/div>\n  \u003ccode class=\"code-block\">\u003cspan class=\"kw\">contract\u003c/span> \u003cspan class=\"fn\">WalletLibrary\u003c/span> {\n    \u003cspan class=\"tp\">address\u003c/span>[] \u003cspan class=\"kw\">public\u003c/span> owners;\n\n    \u003cspan class=\"cmt\">// Qualquer um podia chamar!\u003c/span>\n\u003cspan class=\"vuln-line\">    \u003cspan class=\"kw\">function\u003c/span> \u003cspan class=\"fn\">initWallet\u003c/span>(\u003cspan class=\"tp\">address\u003c/span>[] _owners,\u003c/span>\n\u003cspan class=\"vuln-line\">        \u003cspan class=\"tp\">uint\u003c/span> _required) \u003cspan class=\"kw\">public\u003c/span> {\u003c/span>\n        owners \u003cspan class=\"op\">=\u003c/span> _owners;\n        required \u003cspan class=\"op\">=\u003c/span> _required;\n    }\n\n    \u003cspan class=\"kw\">function\u003c/span> \u003cspan class=\"fn\">kill\u003c/span>(\u003cspan class=\"tp\">address\u003c/span> _to)\n        \u003cspan class=\"kw\">onlyOwner\u003c/span> \u003cspan class=\"kw\">external\u003c/span> {\n\u003cspan class=\"vuln-line\">        \u003cspan class=\"fn\">selfdestruct\u003c/span>(_to);\u003c/span>\n    }\n}\n  \u003c/code>\n  \u003cdiv class=\"lesson-box\">\n    \u003cdiv class=\"lesson-label\">Lição\u003c/div>\n    \u003cp>Libraries compartilhadas \u003cstrong>não devem ter estado mutável\u003c/strong>. Use \u003cspan class=\"lime\">initializer guards\u003c/span> ou libraries pure/internal.\u003c/p>\n  \u003c/div>\n  \u003cdiv class=\"branding\">\u003cspan>Solbook · \u003cspan class=\"author-name\">Lucas Oliveira\u003c/span>\u003c/span>\u003cspan>linkedin.com/in/olivmath\u003c/span>\u003c/div>\n","\n  \u003cspan class=\"slide-num\">04 / 05\u003c/span>\n  \u003cspan class=\"slide-label\">Análise Técnica\u003c/span>\n  \u003cdiv class=\"section-title\">Como o ataque funcionou\u003c/div>\n  \u003cdiv class=\"tech-flow\">\n    \u003cdiv class=\"step\">\u003cspan class=\"highlight\">PASSO 1\u003c/span>\u003c/div>\n    \u003cdiv class=\"step\">Library deployada como contrato comum (não inicializada)\u003c/div>\n    \u003cdiv class=\"step\">\u003cspan class=\"arrow\">↓\u003c/span>\u003c/div>\n    \u003cdiv class=\"step\">\u003cspan class=\"highlight\">PASSO 2\u003c/span>\u003c/div>\n    \u003cdiv class=\"step\">devops199 chama \u003cspan class=\"danger\">initWallet()\u003c/span> na library\u003c/div>\n    \u003cdiv class=\"step\">\u003cspan class=\"arrow\">↓\u003c/span>\u003c/div>\n    \u003cdiv class=\"step\">\u003cspan class=\"highlight\">PASSO 3\u003c/span>\u003c/div>\n    \u003cdiv class=\"step\">Vira owner da library (sem nenhuma proteção)\u003c/div>\n    \u003cdiv class=\"step\">\u003cspan class=\"arrow\">↓\u003c/span>\u003c/div>\n    \u003cdiv class=\"step\">\u003cspan class=\"highlight\">PASSO 4\u003c/span>\u003c/div>\n    \u003cdiv class=\"step\">Chama \u003cspan class=\"danger\">kill()\u003c/span> como owner\u003c/div>\n    \u003cdiv class=\"step\">\u003cspan class=\"arrow\">↓\u003c/span>\u003c/div>\n    \u003cdiv class=\"step\">\u003cspan class=\"highlight\">PASSO 5\u003c/span>\u003c/div>\n    \u003cdiv class=\"step\">\u003cspan class=\"danger\">selfdestruct\u003c/span> destrói o bytecode da library\u003c/div>\n    \u003cdiv class=\"step\">\u003cspan class=\"arrow\">↓\u003c/span>\u003c/div>\n    \u003cdiv class=\"step\">\u003cspan class=\"highlight\">RESULTADO\u003c/span>\u003c/div>\n    \u003cdiv class=\"step\">\u003cspan class=\"danger\">Todos os wallets que usavam delegatecall → quebrados\u003c/span>\u003c/div>\n    \u003cdiv class=\"step\">\u003cspan class=\"danger\">US$280M inacessíveis permanentemente\u003c/span>\u003c/div>\n  \u003c/div>\n  \u003cdiv class=\"branding\">\u003cspan>Solbook · \u003cspan class=\"author-name\">Lucas Oliveira\u003c/span>\u003c/span>\u003cspan>linkedin.com/in/olivmath\u003c/span>\u003c/div>\n","\n  \u003cspan class=\"slide-num\">05 / 05\u003c/span>\n  \u003cspan class=\"slide-label\">On-Chain\u003c/span>\n  \u003cdiv class=\"section-title\">Verifique na Blockchain\u003c/div>\n  \u003cdiv style=\"display:flex;gap:32px;align-items:flex-start\">\n    \u003cdiv style=\"flex:1\">\n      \u003ca class=\"link-card\" href=\"https://etherscan.io/tx/0x05f71e1b2cb4f03e547739db15d080fd30c989eda04d37ce6264c5686c0722\" target=\"_blank\">\n        \u003cdiv>\n          \u003cdiv class=\"label\">Transação do kill()\u003c/div>\n          \u003cdiv class=\"url\">etherscan.io/tx/0x05f71e...c0722\u003c/div>\n        \u003c/div>\n      \u003c/a>\n      \u003ca class=\"link-card\" href=\"https://etherscan.io/address/0x863DF6BFa4469f3ead0bE8f9F2AAE51c91A907b4\" target=\"_blank\">\n        \u003cdiv>\n          \u003cdiv class=\"label\">Parity WalletLibrary\u003c/div>\n          \u003cdiv class=\"url\">etherscan.io/address/0x863DF...07b4\u003c/div>\n        \u003c/div>\n      \u003c/a>\n    \u003c/div>\n    \u003cimg src=\"landing-pages/livro/assets/book-cover-mockup.png\" alt=\"Solbook - Smartcontract Engineer\" class=\"book-cover\">\n  \u003c/div>\n  \u003cdiv class=\"cta-box\">\n    \u003ch3>Solbook — Smartcontract Engineer\u003c/h3>\n    \u003cp>Entenda por que selfdestruct é perigoso e como proteger libraries\u003c/p>\n  \u003c/div>\n  \u003cdiv class=\"branding\">\u003cspan>Solbook · \u003cspan class=\"author-name\">Lucas Oliveira\u003c/span>\u003c/span>\u003cspan>linkedin.com/in/olivmath\u003c/span>\u003c/div>\n"]}</script><script src="carousel/dist/app.js"></script></body></html>
